# This place: what the brain shows and uses here (docs/dev/places.md). Edit freely.
version: 1
name: "My lab"     # the hub's title and the startup title (the same for every persona)
venue: home        # the venue (venues/<name>.yaml) used when --venue / $LAB_OS_VENUE don't say
persona: lab-assistant   # who the assistant is (lab-os's config/personas/, or your own personas/)
ai_budget_usd_month: 5   # the hub's chat pauses when this month's AI spend reaches it
chat_keep_minutes: 30    # a reset or interrupted conversation can be brought back this long (0 = off)
# domain: hub.example.com   # the brain's address name (not used yet); leave out if none
