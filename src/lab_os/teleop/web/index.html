<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lab-os teleop</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>lab-os teleop</h1>
    <p class="hint">Grip = clutch (hold to move) · Trigger = gripper · A/X = stop</p>

    <button id="enter" disabled>Checking WebXR…</button>
    <p id="xr-msg" class="hint"></p>

    <section class="panel">
      <div><span class="label">Server</span> <span id="conn" class="pill off">disconnected</span></div>
      <div><span class="label">Arm</span> <span id="state" class="pill off">—</span></div>
      <div><span class="label">Gripper</span> <span id="gripper">—</span></div>
      <div><span class="label">Speed</span> <span id="speed">—</span></div>
    </section>

    <section class="panel">
      <div class="label">Controllers (what this page sends)</div>
      <pre id="readout">no XR session yet</pre>
    </section>

    <p class="hint"><a href="/monitor" target="_blank">Open the arm monitor</a> in another tab to watch the fake arm.</p>
  </main>
  <script src="/static/xr.js"></script>
</body>
</html>
