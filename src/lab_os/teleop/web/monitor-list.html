<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/design/kit.css">
  <style>
    #kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; align-content: start; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
    .kind { display: block; width: 100%; text-align: left; cursor: pointer; border: 0; color: inherit; font: inherit; }
    .kind:hover, .kind:focus-visible { --c: var(--hot); outline: none; }
    .kind h2 { justify-content: space-between; }
    .kind h2 small { font: var(--w-lines) 0.8rem var(--f-lines); color: var(--text-dim); }
    .arms { display: flex; gap: 0.8rem; min-height: 9rem; }
    .arm { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; }
    .arm svg { width: 100%; height: 8rem; display: block; }
    .arm .seg { stroke: var(--primary); stroke-width: 3; stroke-linecap: round; fill: none; }
    .arm .dot { fill: var(--hot); }
    .raspbot-preview .camera-direction { stroke: var(--primary); stroke-width: 3; stroke-linecap: round; }
    .raspbot-preview .chassis { fill: none; stroke: var(--text-dim); stroke-width: 2; }
    .arm .floor { stroke: var(--line); stroke-width: 1.5; }
    .arm.frozen .seg { stroke: var(--accent); }
    .arm .who { font: var(--w-lines) 0.8rem/1.3 var(--f-lines); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .none { margin: auto 0; font: var(--w-lines) 0.9rem/1.45 var(--f-lines); color: var(--text-dim); }
  </style>
</head>
<!--
  The Monitor list (quick job 147): one card for each kind of robot with a Monitor page of its own
  (/monitor/so101, /monitor/xarm; KINDS in /static/arm/kinds.js). Each card shows a small side view of
  each arm of that kind and its state, or says that none is connected. A tap opens that kind's page.
  The hub also lists the Raspbot. Light for a Pi’s touchscreen: a few lines of SVG at 5 Hz.
-->
<body class="monitor-list">
<div class="page">
  <header class="bar">
    <div class="title"><svg class="ico"><use href="/web/design/icons.svg#i-screen"/></svg><span>Monitor</span></div>
    <span class="place"></span>
    <div class="chips" aria-label="Status">
      <span class="chip"><b>Brain</b><span id="conn" class="pill off">connecting</span></span>
    </div>
    <span class="grow"></span>
    <span class="clock"></span>
    <button id="stop" class="stop" type="button" title="Freeze the arm (works from every page)">STOP</button>
  </header>
  <main id="kinds"></main>
</div>
<script type="module" src="/web/design/kit.js"></script>
<script type="module" src="/static/monitor-list.js"></script>
</body>
</html>
