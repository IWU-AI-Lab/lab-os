<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/design/kit.css">
  <style>
    /* All Pages' tiles (hub/web/pages.html), a little larger: there are fewer of them (quick job 170) */
    #kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(18rem, 100%), 1fr)); gap: .8rem;
      align-content: start; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .tile { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .4rem .85rem; align-content: start; text-align: left; padding: .95rem; font-size: 1.15rem; }
    .tile > .ico { grid-row: span 2; align-self: start; font-size: 1.7rem; color: var(--c); }
    .tile small { font: var(--w-lines) 1rem/1.35 var(--f-lines); color: var(--text-dim); white-space: normal; text-transform: none; letter-spacing: normal; }
  </style>
</head>
<!--
  The Monitor list (quick job 147): one card for each kind of robot with a Monitor page of its own
  (/monitor/so101, /monitor/xarm; KINDS in /static/arm/kinds.js), and in the hub also the Raspbot. The
  cards look like All Pages' tiles (quick job 170) and say how many robots of that kind are connected.
  A tap opens that kind's page.
-->
<body class="monitor-list">
<div class="page">
  <header class="bar">
    <div class="title"><svg class="ico"><use href="/web/design/icons.svg#i-screen"/></svg><span>Monitor</span></div>
    <span class="place"></span>
    <div class="chips" aria-label="Status">
      <span class="chip"><b>Brain</b><span id="conn" class="pill off">Connecting</span></span>
    </div>
    <span class="grow"></span>
    <span class="clock"></span>
    <button id="stop" class="stop" type="button" title="Freeze the arm (works from every page)">STOP</button>
  </header>
  <main id="kinds"></main>
</div>
<script type="module" src="/web/design/kit.js"></script>
<script type="module" src="/static/monitor-list.js"></script>
</body>
</html>
