<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/design/kit.css">
  <style>
    main.one { display: grid; gap: 1rem; max-width: 46rem; width: 100%; margin: 0 auto; padding: 1rem; }
    #lines { list-style: none; margin: 0.4rem 0 0; padding: 0; display: grid; gap: 0.5rem; }
    #lines li { display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.6rem; align-items: start; font: var(--w-lines) 0.92rem/1.45 var(--f-lines); color: var(--text); }
    #lines .ico { width: 1.2rem; height: 1.2rem; color: var(--c); }
    #lines li.no .ico { color: var(--danger); }
    #lines li.no { color: var(--hot); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; margin-top: 1.1rem; }
    #msg { font: var(--w-lines) 0.85rem/1.4 var(--f-lines); color: var(--text-dim); margin: 0.8rem 0 0; }
    .hint { font: var(--w-lines) 0.82rem/1.45 var(--f-lines); color: var(--text-dim); margin: 0.4rem 0 0; }
  </style>
</head>
<!--
  Training: one press to start the SO-101 training setup (so101-green + LeLab) on the brain's
  computer, after lab_os.green's check: both green arms plugged in, nothing else on a serial port,
  LeLab's saved ports exactly the green ones, the same way round as last time. lab-os opens no port;
  LeLab does, when you press teleop or record in its own page. docs/guides/green-launcher.md.
-->
<body class="training">
<div class="page">
  <header class="bar">
    <div class="title"><svg class="ico"><use href="/web/design/icons.svg#i-leader"/></svg><span>Training</span></div>
    <span class="place"></span>
    <div class="chips"><span class="chip"><b>LeLab</b><span id="state" class="pill off">—</span></span></div>
    <span class="grow"></span>
    <span class="clock"></span>
  </header>
  <main class="one">
    <section class="card"><div class="in">
      <h2><svg class="ico"><use href="/web/design/icons.svg#i-shield"/></svg>SO-101 training setup</h2>
      <p class="hint">The green arms with LeLab. Checked first; nothing is opened until every line is fine.</p>
      <ul id="lines"><li><span></span><span>Checking…</span></li></ul>
      <div class="actions">
        <button id="start" class="btn primary" type="button" disabled>Start</button>
        <button id="stop-lelab" class="btn small" type="button" hidden>Stop LeLab</button>
        <button id="again" class="btn small" type="button">Check again</button>
        <a id="open" class="btn small" target="_blank" rel="noopener" hidden>Open LeLab</a>
      </div>
      <p id="msg" aria-live="polite"></p>
    </div></section>
  </main>
</div>
<script type="module" src="/web/design/kit.js"></script>
<script type="module">
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const icon = (ok) => `<svg class="ico"><use href="/web/design/icons.svg#${ok ? "i-shield" : "i-warn"}"/></svg>`;
  function show(c) {
    $("#lines").innerHTML = c.lines.map((l) => `<li class="${l.ok ? "ok" : "no"}">${icon(l.ok)}<span>${esc(l.text)}</span></li>`).join("");
    const st = $("#state");
    st.textContent = c.running ? "running" : c.ok ? "ready" : "not safe";
    st.className = `pill ${c.running ? "on" : c.ok ? "off" : "warn"}`;
    $("#start").disabled = !c.ok || c.running || !c.here;
    $("#open").hidden = !c.running;
    $("#stop-lelab").hidden = !c.running || !c.here;
    $("#open").href = c.url;  // LeLab's own page, on this computer
    $("#msg").textContent = !c.here ? "It starts only on the brain's computer."
      : c.started ? "Starting in a terminal on this desktop; LeLab opens in the browser (Ctrl+C in the terminal stops it)."
      : c.ok ? "" : "Not safe to start: fix the lines marked with a warning, then Check again.";
  }
  async function load() {
    const r = await fetch("/api/green").catch(() => null);
    if (r?.ok) show(await r.json());
    else $("#msg").textContent = "The brain didn't answer.";
  }
  $("#again").onclick = load;
  $("#stop-lelab").onclick = async () => {
    if (!confirm("Stop LeLab? A recording or training run in it stops too.")) return;
    $("#stop-lelab").disabled = true;
    const r = await fetch("/api/green/stop", { method: "POST" }).catch(() => null);
    $("#stop-lelab").disabled = false;
    if (r?.ok) { const d = await r.json(); show(d); $("#msg").textContent = d.said; }
    else $("#msg").textContent = r ? await r.text() : "The brain didn't answer.";
  };
  $("#start").onclick = async () => {
    $("#start").disabled = true;
    const r = await fetch("/api/green/start", { method: "POST" }).catch(() => null);
    if (r?.ok) show(await r.json());
    else $("#msg").textContent = r ? await r.text() : "The brain didn't answer.";
    setTimeout(load, 6000);
  };
  load();
  setInterval(load, 10000);
</script>
</body>
</html>
