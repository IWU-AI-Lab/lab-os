<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Pages</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/design/kit.css">
  <style>
    #list { overflow-y: auto; max-width: 64rem; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    /* the search: the Command Center's look, with a search icon (quick job 160) */
    .find { position: relative; display: block; width: min(100%, 25rem); margin-bottom: 1.4rem; }
    .find .ico { position: absolute; left: 0.65rem; top: 50%; translate: 0 -50%; font-size: 1rem; color: var(--c); pointer-events: none; }
    #search { width: 100%; font: 500 0.9rem/1.2 var(--f-ui); color: var(--text); background: color-mix(in srgb, var(--bg) 70%, transparent);
      border: 1px solid var(--line); padding: 0.45rem 0.6rem 0.45rem 2.1rem; min-height: 2.3rem; }
    #search::placeholder { color: var(--text-dim); }
    #search:focus-visible { outline: 1px solid var(--c); border-color: var(--c); }
    /* each group: its title with an icon, then its tiles, with room before the next group */
    .rows h2 { margin: 0 0 0.7rem; }
    .rows .tiles + h2 { margin-top: 1.8rem; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(14rem, 100%), 1fr)); gap: .6rem; }
    .tile { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .65rem; align-content: start; text-align: left; padding: .7rem; }
    .tile > .ico { grid-row: span 2; align-self: start; font-size: 1.3rem; color: var(--c); }
    .tile small { font: var(--w-lines) .85rem/1.35 var(--f-lines); color: var(--text-dim); white-space: normal; text-transform: none; letter-spacing: normal; }
    .lead { margin: 0 0 0.8rem; font: var(--w-lines) 0.85rem/1.4 var(--f-lines); color: var(--text-dim); }
    .none { font: var(--w-lines) 0.9rem/1.4 var(--f-lines); color: var(--text-dim); }
  </style>
</head>
<!--
  All Pages (quick job 67; its own page since quick job 82, before it was a group in ⚙): every page the
  brain serves (/api/hub → pages, PAGES in hub/server.py), each with Open. The hub opens it from its strip.
  Quick job 133: in the hub, Open asks the hub to show the page as a module (its view, /api/hub → views);
  "Open on…" there moves it to a window of its own. Opened on its own, each page opens in a new window.
-->
<body class="settings">
<div class="page">
  <header class="bar">
    <div class="title"><svg class="ico"><use href="/web/design/icons.svg#i-link"/></svg><span>All Pages</span></div>
    <span class="place"></span>
    <span class="grow"></span>
    <span class="clock"></span>
  </header>
  <main id="list">
    <p class="lead" id="lead">Each page opens in a window of its own.</p>
    <label class="find"><svg class="ico" aria-hidden="true"><use href="/web/design/icons.svg#i-search"/></svg><input type="search" id="search" aria-label="Search pages" placeholder="Search pages"></label>
    <div class="rows" id="rows"></div>
  </main>
</div>
<script type="module" src="/web/design/kit.js"></script>
<script type="module">
import { GROUP_ICON, PAGE_GROUPS, VIEW_ICON } from "/hub/page-groups.js";
const ico = (id) => `<svg class="ico" aria-hidden="true"><use href="/web/design/icons.svg#${id}"/></svg>`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rows = document.querySelector("#rows");
const hub = await fetch("/api/hub", { cache: "no-store" }).then((r) => r.json()).catch(() => null);
if (!hub?.pages?.length) rows.innerHTML = `<div class="row"><span class="help">The brain didn't answer. Its terminal has the details.</span></div>`;
// in the hub's module frame (same brain): the hub opens each page as a module (quick job 133)
let inHub = false;
try { inHub = parent !== window && parent.location.origin === location.origin && parent.location.pathname === "/"; } catch {}
const viewOf = Object.fromEntries((hub?.views || []).filter((v) => v.page).map((v) => [v.page, v.id]));
viewOf["/"] = "hub";
if (inHub) document.querySelector("#lead").textContent = "Each page opens here, in the hub. Open on… moves it to a window of its own.";
function renderPages() {
  if (!hub?.pages?.length) return;
  rows.replaceChildren();
  const query = document.querySelector("#search").value.trim().toLowerCase();
  const groups = new Map([...PAGE_GROUPS, ["Other", []]].map(([name]) => [name, []]));
  for (const p of hub.pages) {
    const name = PAGE_GROUPS.find(([, ids]) => ids.includes(viewOf[p.path]))?.[0] || "Other";
    if (`${name} ${p.title} ${p.line} ${p.path}`.toLowerCase().includes(query)) groups.get(name).push(p);
  }
  for (const [name, pages] of groups) {
    if (!pages.length) continue;
    const title = document.createElement("h2");
    title.innerHTML = `${ico(GROUP_ICON[name] || "i-apps")}${esc(name)}`;
    const tiles = document.createElement("div");
    tiles.className = "tiles";
    rows.append(title, tiles);
    for (const p of pages) {
      const r = document.createElement("button");
      r.type = "button";
      r.className = "btn tile";
      r.setAttribute("aria-label", `Open ${p.title}`);
      r.innerHTML = `${ico(VIEW_ICON[viewOf[p.path]] || "i-link")}<b>${esc(p.title)}</b><small>${esc(p.line)}</small>`;
      r.addEventListener("click", () => {
        if (inHub && viewOf[p.path] && p.path !== "/pages") return parent.postMessage({ type: "lab-os-open-view", id: viewOf[p.path] }, location.origin);
        if (!window.open(p.path, `lab-os-page-${p.path}`)) location.href = p.path;  // a blocked window: here
      });
      tiles.append(r);
    }
  }
  if (!rows.children.length) rows.innerHTML = `<p class="none">No page matches the search.</p>`;
}
document.querySelector("#search").addEventListener("input", renderPages);
renderPages();
</script>
</body>
</html>
