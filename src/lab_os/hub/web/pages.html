<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Pages</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/design/kit.css">
  <style>
    #list { overflow-y: auto; max-width: 64rem; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .rows { border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 80%, transparent);
      clip-path: polygon(0.7rem 0, 100% 0, 100% calc(100% - 0.7rem), calc(100% - 0.7rem) 100%, 0 100%, 0 0.7rem); }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.15rem 0.8rem; align-items: center; padding: 0.7rem 0.8rem 0.7rem 1rem;
      border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); min-height: 3.2rem; }
    .row:first-child { border-top: 0; }
    .row b { font: 500 0.98rem/1.25 var(--f-ui); color: var(--text); }
    .row .help { margin-top: 0.15rem; font: var(--w-lines) 0.8rem/1.4 var(--f-lines); color: var(--text-dim); }
    .lead { margin: 0 0 0.8rem; font: var(--w-lines) 0.85rem/1.4 var(--f-lines); color: var(--text-dim); }
  </style>
</head>
<!--
  All Pages (quick job 67; its own page since quick job 82, before it was a group in ⚙): every page the
  brain serves (/api/hub → pages, PAGES in hub/server.py), each with Open. The hub opens it from its strip.
-->
<body class="settings">
<div class="page">
  <header class="bar">
    <div class="title"><svg class="ico"><use href="/web/design/icons.svg#i-link"/></svg><span>All Pages</span></div>
    <span class="place"></span>
    <span class="grow"></span>
    <span class="clock"></span>
  </header>
  <main id="list">
    <p class="lead">Each page opens in a window of its own.</p>
    <div class="rows" id="rows"></div>
  </main>
</div>
<script type="module" src="/web/design/kit.js"></script>
<script type="module">
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rows = document.querySelector("#rows");
const hub = await fetch("/api/hub", { cache: "no-store" }).then((r) => r.json()).catch(() => null);
if (!hub?.pages?.length) rows.innerHTML = `<div class="row"><span class="help">The brain didn't answer. Its terminal has the details.</span></div>`;
for (const p of hub?.pages || []) {
  const r = document.createElement("div");
  r.className = "row";
  r.innerHTML = `<div><b>${esc(p.title)}</b><div class="help">${esc(p.path)} · ${esc(p.line)}</div></div><button type="button" class="btn small">Open</button>`;
  r.querySelector("button").addEventListener("click", () => {
    if (!window.open(p.path, `lab-os-page-${p.path}`)) location.href = p.path;  // a blocked window: here
  });
  rows.append(r);
}
</script>
</body>
</html>
