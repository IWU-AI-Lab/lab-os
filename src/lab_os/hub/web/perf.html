<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance test</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ccc; }
    body { font: 14px/1.4 system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 8px; top: 8px; padding: 8px 10px; max-width: calc(100% - 36px);
      background: rgba(0, 0, 0, 0.75); border: 1px solid #333; font-variant-numeric: tabular-nums;
    }
    #fps { font-size: 28px; color: #fff; }
    #controls { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; }
    #controls[hidden], #full[hidden], .fs-why[hidden] { display: none; }
    .fs-why { flex-basis: 100%; color: #ccc; }
    select, button { font: inherit; min-height: 2.2em; }
  </style>
</head>
<body>
<!-- Performance test (current-focus.md step 1): how much drawing each screen can carry, so step 10
     knows which quality level fits. Only dots, links and star streaks; settings are in the address
     (e.g. /perf?draw=net&density=90&stars=3000&res=2) so a screen can be bookmarked. -->
<canvas id="cv"></canvas>
<div id="hud">
  <div id="fps">… fps</div>
  <div id="info"></div>
  <div id="controls">
    <label>Draw <select id="draw">
      <option value="all">dots + links + streaks</option>
      <option value="net">dots + links</option>
      <option value="dots">dots only</option>
      <option value="streaks">streaks only</option>
    </select></label>
    <label>Dots per million pixels <select id="density">
      <option>45</option><option>90</option><option>120</option><option>240</option>
    </select></label>
    <label>Stars <select id="stars">
      <option>0</option><option>1000</option><option>3000</option><option>6000</option>
    </select></label>
    <label>Resolution <select id="res">
      <option value="2">full (device pixels, up to 2×)</option>
      <option value="1">1× (CSS pixels)</option>
      <option value="0.5">half</option>
    </select></label>
    <button id="full" type="button">Full screen</button>
    <button id="hide" type="button">Hide controls</button>
  </div>
</div>
<script type="module" src="/hub/perf.js"></script>
</body>
</html>
