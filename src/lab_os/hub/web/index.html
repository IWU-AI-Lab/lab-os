<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/hub/hub.css">
</head>
<body class="waiting">
<!--
  The plain hub (docs/plan/current-focus.md, phase 1). It has the same parts, ids and classes as the approved
  concept (docs/design/hub-concept.html), so the reveal (step 10) restyles them instead of rebuilding.
  Plain on purpose until then. All data comes from the brain's /api/ endpoints and /theme.json.
-->

<main id="hub" hidden>
  <header class="strip panel">
    <div class="brand" id="brand"></div>
    <div class="fact" id="f-venue" title="Venue"></div>
    <div class="fact" id="f-persona" title="Assistant (persona)"></div>
    <div class="fact" id="f-net" title="Internet"></div>
    <div class="fact" id="f-ai" title="AI"></div>
    <div class="fact off" id="f-arm" title="Arm" hidden></div>
    <!-- listening for the wake word (step 7): a small dot, separate from the assistant's `listening` -->
    <div class="fact" id="f-wake" hidden title="Listening for the wake word">●</div>
    <div class="fact"><span class="clock" id="clock"></span><span class="ampm" id="ampm"></span></div>
    <button id="fs-btn" type="button" hidden>Full screen</button>
    <!-- what the Quest sees, in a window on this computer (quick job 36): the brain's computer only -->
    <button id="qv-btn" type="button" aria-pressed="false" hidden>Quest view</button>
  </header>

  <!-- the greeting after the start press: "Good evening." + one line of real news (or the persona's line) -->
  <div id="boot-greet" aria-live="polite"></div>

  <!-- pages this device opened on another one ("open on…", step 8): Bring it back closes them there -->
  <div id="sent" hidden></div>

  <!-- module buttons come from the module list (hub.modules); chat isn't one: it belongs to the core -->
  <nav id="mods" aria-label="Modules"><div class="mcol l"></div><div class="mcol r"></div></nav>

  <section class="core" data-state="offline" aria-label="Assistant">
    <div id="orb" aria-hidden="true"></div>
    <span id="state-word" aria-live="polite"></span>
    <!-- ask from the core: type here (or anywhere on the hub); the answer appears under it -->
    <div id="ask-btn" class="panel">
      <form id="quick-form" autocomplete="off"><input id="quick" aria-label="Ask the assistant" placeholder="Ask anything" maxlength="2000"></form>
      <!-- voice (step 7): hold to talk; only where this screen has a microphone and voice works -->
      <button id="mic" class="mic" type="button" hidden title="Hold to talk (or hold Space)">Talk</button>
      <button id="open-chat" type="button" title="Open the conversation" aria-label="Open the conversation">History <b id="chat-n"></b></button>
    </div>
    <!-- a reset or a restart keeps the last conversation for a while (place.yaml chat_keep_minutes) -->
    <button id="restore-chat" type="button" hidden>Bring back the last conversation</button>
    <div id="reply" aria-live="polite"><div class="q"></div><div class="a"></div></div>
    <div id="try" hidden></div><!-- visitor mode (quick job 35): the venue's "try this" cards -->
    <div id="errmsg" role="alert" hidden></div>
  </section>

  <aside class="side left">
    <div class="panel" data-detail="project" id="p-panel" hidden>
      <div class="head"><span class="cap">Current Project</span></div>
      <div class="big" id="p-focus"></div>
      <div class="prog"><span class="stepn" id="p-step"></span></div>
      <div class="next"><span class="k">Next:</span> <span id="p-next"></span></div>
    </div>
    <div class="panel" data-detail="spend" id="s-panel" hidden title="Estimated from the token counts and the prices in models.yaml. Another computer's brain that uses the same key is not counted.">
      <div class="head"><span class="cap">AI Spend</span></div>
      <div class="row2"><span class="money" id="money"></span><span>this month</span></div>
      <div class="meter" id="meter" hidden><i id="meter-fill"></i></div>
      <div class="budget" id="s-budget"></div>
      <div class="budget">Estimated · this computer's brain only</div>
    </div>
  </aside>

  <aside class="side right">
    <div class="panel" data-detail="commits" id="c-panel" hidden>
      <div class="head"><span class="cap">Commits</span></div>
      <div class="row2">
        <span><b class="tot" id="commit-total"></b> commits</span>
        <span class="range" id="range" role="group" aria-label="How many days"></span>
      </div>
      <div id="spark" role="img" aria-label="Commits per day"></div>
      <div class="axis"><span id="ax0"></span><span id="ax1"></span></div>
    </div>
    <!-- Devices arrive with the roll call (docs/plan/ideas.md → "On hold") -->
  </aside>
</main>

<div id="module" role="dialog" aria-modal="true" aria-labelledby="mod-title" hidden>
  <div class="bar">
    <button class="back" id="mod-back" type="button" aria-label="Back to the hub">‹ Back <span class="key">Esc</span></button>
    <div class="tab"><span id="mod-title"></span></div>
    <!-- opened here from another device: Back closes it (that device can also bring it back) -->
    <span id="mod-from" hidden></span>
    <span class="grow"></span>
    <!-- "open on…" (step 8): the other devices with the hub open -->
    <button class="back" id="mod-open-on" type="button" aria-haspopup="true" aria-expanded="false">Open on…</button>
  </div>
  <div id="open-on" class="panel" hidden></div>
  <div id="mod-slot"></div>
</div>
<!-- the whole conversation (History): opens over the hub, Back/Esc closes it -->
<section class="chat panel" id="chat" aria-label="Chat" hidden>
  <div class="bar">
    <button class="back" id="chat-back" type="button" aria-label="Back to the hub">‹ Back <span class="key">Esc</span></button>
    <div class="tab">Conversation</div>
  </div>
  <div id="log-chat" aria-live="polite"></div>
  <form class="ask" id="ask-form" autocomplete="off"><span aria-hidden="true">›</span><input id="ask" aria-label="Ask the assistant" placeholder="Ask about the lab or the project" maxlength="2000"><button class="mic" type="button" hidden title="Hold to talk (or hold Space)">Talk</button></form>
</section>
<!-- while a module is open, the assistant's picture sits here (the core never disappears) -->
<div id="orb-dock" data-state="offline" aria-hidden="true"></div>
<!-- ... and what it hears and says (the question and answer move here from under the core) -->
<div id="dock-say"></div>

<div id="ignite" role="button" tabindex="0" aria-label="Start the hub">
  <div id="ign-orb" aria-hidden="true"></div>
  <div class="stack">
    <p id="ign-full">Tap for full screen</p>
    <p id="ign-what">Tap, click or press any key to start</p>
    <p class="safe"><span>Safe to start. This only opens the hub; no robot moves.</span></p>
  </div>
  <div class="ign-foot">
    <span id="ign-venue"></span>
    <span><span class="clock" id="ign-clock"></span><span class="ampm" id="ign-ampm"></span></span>
  </div>
</div>

<script type="module" src="/hub/hub.js"></script>
</body>
</html>
