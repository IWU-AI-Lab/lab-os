<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raspbot Monitor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/design/kit.css">
  <script type="importmap">
    {"imports":{"three":"/web/vendor/three/three.module.js","three/examples/jsm/":"/web/vendor/three/examples/jsm/"}}
  </script>
  <style>
    .monitor-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(17rem, 29%); gap: 0.8rem; align-content: start; overflow: auto; scrollbar-width: thin; }
    .camera-frame { position: relative; display: grid; place-items: center; min-height: 9rem; width: 100%; aspect-ratio: 4 / 3; max-height: 62vh; background: var(--bg); border: 1px solid var(--line); }
    .camera-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .camera-frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .camera-tools { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.5rem; }
    .camera-tools .btn { min-height: 2.5rem; }
    .camera-tools .btn[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 22%, var(--surface)); border-color: var(--primary); }
    .camera-tools .msg { margin: 0; overflow-wrap: anywhere; }
    .camera-frame p { padding: 0.65rem; margin: 0; color: var(--text-dim); text-align: center; }
    .model { display: block; width: 100%; height: clamp(6rem, 25vh, 13rem); }
    dl.facts { grid-template-columns: minmax(0, 1fr) auto; column-gap: 0.55rem; }
    .facts dt { letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
    .facts dd { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* no camera picture (quick job 155): the camera card gets small, the status and the 3D model get the room */
    .monitor-body.no-camera { grid-template-columns: minmax(14rem, 1fr) minmax(0, 2fr); }
    .no-camera .camera-frame { aspect-ratio: auto; min-height: 9rem; height: 14rem; }
    .no-camera .model { height: clamp(10rem, 42vh, 26rem); }
    .no-camera dl.facts { grid-template-columns: minmax(0, auto) auto minmax(0, auto) auto; column-gap: 1.6rem; }
    @media (max-width: 560px) {
      .monitor-body.no-camera { grid-template-columns: minmax(0, 1fr); }
      .monitor-body { grid-template-columns: minmax(0, 1fr); }
      .camera-frame { max-height: 38vh; }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="bar">
    <div class="title"><svg class="ico" aria-hidden="true"><use href="/web/design/icons.svg#i-screen"/></svg><span>Raspbot Monitor</span></div>
    <span class="place"></span>
    <span class="grow"></span>
    <span class="clock"></span>
    <button id="stop" class="stop" type="button" title="Stop the Raspbot">STOP</button>
  </header>
  <main class="monitor-body">
    <section class="card"><div class="in">
      <h2>Camera</h2>
      <div class="camera-frame">
        <p id="camera-status">Connecting…</p>
        <img id="camera" alt="The Raspbot’s live camera" hidden>
        <canvas id="labels" aria-hidden="true"></canvas>
      </div>
      <div class="camera-tools">
        <button id="labels-btn" class="btn" type="button" aria-pressed="false" title="A box and a label on each object the brain finds in the picture" disabled>Labels off</button>
        <p id="labels-msg" class="msg" aria-live="polite"></p>
      </div>
    </div></section>
    <section class="card"><div class="in">
      <h2 id="name">Raspbot</h2>
      <canvas id="raspbot-model" class="model" role="img" aria-label="Live 3D Raspbot"></canvas>
      <p id="model-error" class="hint" hidden>3D model unavailable.</p>
      <dl class="facts">
        <dt>Connection</dt><dd><span id="state" class="pill off">Connecting</span></dd>
        <dt>Control</dt><dd id="control">Unavailable</dd>
        <dt>Motion</dt><dd id="motion">Unavailable</dd>
        <dt>Speed setting</dt><dd id="speed">Unavailable</dd>
        <dt>Pan</dt><dd id="pan">Unavailable</dd>
        <dt>Tilt</dt><dd id="tilt">Unavailable</dd>
        <dt>Ultrasonic distance</dt><dd id="distance">Unavailable</dd>
      </dl>
    </div></section>
  </main>
</div>
<script type="module" src="/web/design/kit.js"></script>
<script type="module" src="/hub/raspbot-monitor.js"></script>
</body>
</html>
