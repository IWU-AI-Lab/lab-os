<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<link rel="icon" href="/hub/media/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/web/vendor/fonts/fonts.css">
<style>
/* The designed hub (docs/plan/current-focus.md step 10, the reveal): docs/design/hub-concept.html made real.
   Same look, motion and sound as the approved concept; the concept's controls and made-up data are gone.
   Every fact comes from the brain (/api/...), the numbers from /theme.json, the fonts from
   /web/vendor/fonts/ (offline). Served at / (/design goes there). */

/* Layout: full-screen hub. Far layer = network canvas + verses; frame; middle = panels around the core;
   front = reticle, alerts, module pages. Tokens mirror config/theme.yaml on the design branch.
   Sizes are in rem, and 1 rem follows the screen, so everything scales together (the core included). */
:root {
  color-scheme: dark;
  --bg: #05080b;
  --surface: #0b161c;
  --line: #1f3d48;
  --text: #d4eef5;
  --text-dim: #6d8c96;
  --primary: #29d4ff;
  --hot: #eafcff;
  --accent: #ff9a2e;
  --danger: #ff2436;
  --offline: #56636a;
  --f-title: "Orbitron", system-ui, sans-serif;
  --f-ui: "Chakra Petch", system-ui, sans-serif;
  --f-lines: "Inter", system-ui, sans-serif;
  --w-lines: 300;
  --f-digits: "DSEG7", "JetBrains Mono", ui-monospace, monospace;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
  --arrive: cubic-bezier(0.16, 1, 0.3, 1);
  --dock: min(16vh, 8.5rem);  /* the docked core on an open page, over its bottom-right corner */
}
/* up to 40 px on a 4K screen (quick job 154: capped at 26 px, the hub was a band in the middle of the 4K) */
html { font-size: clamp(11px, min(0.95vw, 1.7vh), 40px); }
@media (orientation: portrait) { html { font-size: clamp(12px, min(3.3vw, 1.9vh), 26px); } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  --c: var(--primary);
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 500 1rem/1.45 var(--f-ui);
}
body[data-mood="room"][data-alert="warning"] { --c: var(--accent); }
body[data-mood="room"][data-alert="critical"] { --c: var(--danger); }
body[data-alert="warning"] .alertable { --c: var(--accent); }
body[data-alert="critical"] .alertable { --c: var(--danger); }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

#net { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* far-layer verses (maximal) */
#verses { position: fixed; inset: 0; z-index: 1; pointer-events: none; transition: opacity 1s; }
#verses .v { position: absolute; max-width: 34ch; font: 300 max(11px, 0.85rem)/1.6 var(--f-lines); color: var(--text); opacity: 0.17; transition: opacity 2.5s; }
#verses .v cite { display: block; margin-top: 4px; font: 500 max(11px, 0.6rem)/1 var(--f-ui); letter-spacing: 0.24em; text-transform: uppercase; font-style: normal; color: var(--c); }
#verses .v.out { opacity: 0; }

/* frame: cut corners, tabs and notches; extra ticks and sliders in maximal */
#frame { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; transition: opacity 1s; }
#frame .edge { fill: none; stroke: var(--line); stroke-width: 1; }
#frame .hi { fill: none; stroke: var(--c); stroke-width: 2; filter: drop-shadow(0 0 3px var(--c)); }
#frame .tick { stroke: var(--line); stroke-width: 1; }
#frame .slider { fill: var(--c); }
#frame .draw { transition: stroke-dashoffset 1.4s var(--arrive); }
#frame .orn { transition: opacity 0.8s 0.6s; }
.pre-frame #frame .orn { opacity: 0; transition: none; }

/* the hub grid. Columns and rows are symmetric, so the core sits exactly in the middle of the screen. */
#hub {
  --edge-h: 5.4rem;
  --mod-w: 12.6rem;
  --orb: min(54vh, 32vw);
  position: relative; z-index: 2; height: 100%;
  display: grid; gap: 1rem 1.4rem;
  padding-block: 2.2rem;
  padding-left: max(2.6rem, env(safe-area-inset-left, 0px));
  padding-right: max(2.6rem, env(safe-area-inset-right, 0px));
  transition: transform 0.7s var(--arrive), opacity 0.7s, filter 0.7s;
}
body[data-mods="0"] #hub { --mod-w: 0px; }
body[data-layout="launcher"] #hub {
  grid-template-columns: minmax(0, 1fr) var(--mod-w) var(--orb) var(--mod-w) minmax(0, 1fr);
  grid-template-rows: var(--edge-h) minmax(0, 1fr) var(--edge-h);
  grid-template-areas: "strip strip strip strip strip" "left ml core mr right" "log log log log log";
}
body[data-layout="panels"] #hub {
  --orb: min(48vh, 30vw);
  grid-template-columns: minmax(12rem, 0.9fr) var(--orb) minmax(17rem, 1.25fr);
  grid-template-rows: var(--edge-h) minmax(0, 1fr) var(--edge-h);
  grid-template-areas: "strip strip strip" "mods core chat" "log log arm";
}
#traces { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: visible; }
#traces .base { fill: none; stroke: var(--line); stroke-width: 1; }
#traces .end { fill: var(--line); }
#traces .pulse { fill: var(--hot); }

/* panels unfold from their top-left corner (no transform, so positions stay measurable) */
.panel { transition: opacity 0.6s var(--arrive), clip-path 0.8s var(--arrive); clip-path: inset(-20px -20px -20px -20px); }
.panel.hold { opacity: 0; clip-path: inset(0 100% 100% 0); }
.cut {
  --cut: 0.7rem;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  background: color-mix(in srgb, var(--c) 32%, transparent); padding: 1px;
}
.cut > .in {
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  background: color-mix(in srgb, var(--surface) 86%, transparent); height: 100%;
}

/* status strip: real facts only */
.strip { grid-area: strip; align-self: start; position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.6rem; }
.brand { font: 700 1.2rem/1 var(--f-title); letter-spacing: 0.16em; text-transform: uppercase; color: var(--hot); margin-right: auto; text-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); }
.fact { display: flex; align-items: center; gap: 0.45rem; font: var(--w-lines) max(11px, 0.85rem)/1 var(--f-lines); color: var(--text); }
.fact .ico { color: var(--c); font-size: 0.9rem; }
.fact.off, .fact.off .ico { color: var(--offline); }
.fact[hidden] { display: none; }  /* the venue, while it is the place's default one (quick job 154) */
.facts { display: contents; }     /* a group of its own only on a phone (a second row there) */
/* listening for the wake word: a small dot, separate from the core's own `listening` */
#f-wake[hidden] { display: none; }
#f-wake.stalled .wdot { background: var(--accent); animation: none; opacity: 0.9; }  /* the microphone gives no audio */
#f-wake .wdot { width: 0.42rem; height: 0.42rem; border-radius: 50%; background: var(--c); opacity: 0.5; animation: wdot 4s ease-in-out infinite; }
@keyframes wdot { 50% { opacity: 0.15; } }
.clock { font-family: var(--f-digits); font-size: 1.05rem; color: var(--c); letter-spacing: 0.04em; }
.ampm { font: 600 max(11px, 0.62rem)/1 var(--f-ui); letter-spacing: 0.12em; color: var(--c); margin-left: 0.3rem; }

/* module buttons: built from the module list (hub.modules), split left/right of the core */
#mods { display: contents; }
.mcol { display: flex; flex-direction: column; justify-content: center; gap: 1.1rem; min-width: 0; }
.mcol.l { grid-area: ml; } .mcol.r { grid-area: mr; }
body[data-layout="panels"] #mods { grid-area: mods; display: flex; flex-direction: column; justify-content: center; gap: 1.1rem; }
body[data-layout="panels"] .mcol { display: contents; }
.mod { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.mod .in { display: grid; grid-template-columns: 3rem 1fr; align-items: center; gap: 0.6rem; padding: 0.6rem 0.9rem 0.6rem 0.5rem; }
.mod .mico { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mod svg { width: 3rem; height: 3rem; color: var(--c); overflow: visible; }
.mod .name { font: 600 1.05rem/1.1 var(--f-ui); letter-spacing: 0.1em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }  /* "AI Control" on one line */
.mod:hover .cut, .mod:focus-visible .cut { background: color-mix(in srgb, var(--c) 80%, transparent); }
.mod:hover .name, .mod:focus-visible .name { color: var(--hot); }
.mod:focus-visible { outline: none; }
.mod { position: relative; }
body:is(.q-full, .q-maximal) .mod::before, body:is(.q-full, .q-maximal) .mod::after { content: ""; position: absolute; width: 0.7rem; height: 0.7rem; border: 1px solid color-mix(in srgb, var(--c) 70%, transparent); pointer-events: none; transition: inset 0.3s var(--arrive); }
body:is(.q-full, .q-maximal) .mod::before { top: -5px; right: -5px; border-left: 0; border-bottom: 0; }
body:is(.q-full, .q-maximal) .mod::after { bottom: -5px; left: -5px; border-right: 0; border-top: 0; }
body:is(.q-full, .q-maximal) .mod:hover::before { top: -8px; right: -8px; }
body:is(.q-full, .q-maximal) .mod:hover::after { bottom: -8px; left: -8px; }
.mod:hover svg, .mod:focus-visible svg { filter: drop-shadow(0 0 5px var(--c)); }

/* the core: the assistant's picture. Tapping it opens the chat. */
.core { grid-area: core; position: relative; display: grid; place-items: center; min-height: 0; min-width: 0; cursor: pointer; }
body[data-layout="panels"] .core { cursor: default; }
#orb { width: min(100%, var(--orb)); aspect-ratio: 1; color: var(--c); overflow: visible; transition: color 0.5s; }
#orb .glow { filter: drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 14px color-mix(in srgb, var(--c) 40%, transparent)); }
#orb .ring { fill: none; stroke: currentColor; }
#orb .ring.back { opacity: 0.3; }  /* the far half of a ring (the 3D core, quick job 160) */
#orb .rg { opacity: 0; scale: var(--from, 1.4); rotate: var(--spin0, 0deg); transition: opacity 0.35s, scale 0.8s var(--arrive), rotate 1.1s var(--arrive); }
#orb .rg.on { opacity: var(--op, 1); scale: 1; rotate: 0deg; }
#orb .rg.hit { filter: brightness(2) drop-shadow(0 0 4px var(--hot)); }
#orb .lockwave { fill: none; stroke: var(--hot); stroke-width: 1.5; opacity: 0; pointer-events: none; animation: lockwave 0.7s ease-out 1 both; }
@keyframes lockwave { from { opacity: 0.9; scale: 1; stroke-width: 2.5; } to { opacity: 0; scale: 1.35; stroke-width: 0.3; } }
#flare { opacity: 0; pointer-events: none; }
#flare.go { animation: flare 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1; }
@keyframes flare { 0% { opacity: 0; scale: 0.05 1; } 10% { opacity: 1; scale: 1.1 1.6; } 100% { opacity: 0; scale: 1.7 0.5; } }
body:not(.q-maximal) #orb .mx, body:not(.q-maximal) #frame .mx { display: none; }
#core-dot { transform-origin: 0 0; }
[data-state="offline"] { --c: var(--offline); }
[data-state="error"] { --c: var(--danger); }
#ask-btn { position: absolute; top: calc(50% + min(var(--orb), 100%) / 2); left: 50%; transform: translate(-50%, 0.6rem); padding: 0; border: 0; background: none; color: var(--c); cursor: pointer; }
/* ask from the core: type here (or anywhere) and the answer appears under the core; the history button opens the conversation */
#ask-btn { cursor: default; }
#ask-btn .in { display: flex; align-items: center; gap: 0.55rem; padding: 0.35rem 0.4rem 0.35rem 0.9rem; font-size: 1.15rem; }
#quick-form { display: flex; margin: 0; }
#quick { all: unset; display: block; height: 2rem; line-height: 2rem; width: 10rem; font: var(--w-lines) 0.9rem/1.4 var(--f-lines); color: var(--text); caret-color: var(--c); transition: width 0.4s var(--arrive); }
#quick::placeholder { color: var(--text-dim); }
#quick:focus, #quick:not(:placeholder-shown) { width: min(24rem, 60vw); }
#ask-btn:focus-within .cut { background: color-mix(in srgb, var(--c) 80%, transparent); }
#open-chat { display: flex; align-items: center; gap: 0.25rem; min-width: 2.2rem; min-height: 2rem; justify-content: center; padding: 0 0.4rem; border: 0; border-left: 1px solid var(--line); background: none; color: var(--text-dim); cursor: pointer; font-size: 1rem; }
#open-chat b { font: max(11px, 0.7rem)/1 var(--f-digits); color: var(--c); }
/* the mic (step 7): hold it (or Space) and talk; only where this screen has a microphone and voice works */
.mic { position: relative; display: flex; align-items: center; justify-content: center; min-width: 2.4rem; min-height: 2rem; padding: 0 0.45rem; border: 0; border-left: 1px solid var(--line); background: none; color: var(--text-dim); cursor: pointer; font-size: 1.1rem; touch-action: none; user-select: none; -webkit-user-select: none; }
.mic[hidden] { display: none; }
.mic:hover, .mic:focus-visible { color: var(--hot); outline: none; }
.mic::after { content: ""; position: absolute; inset: 0.15rem 0.3rem; border: 1px solid var(--c); opacity: 0; scale: calc(0.7 + var(--lvl, 0) * 0.6); transition: opacity 0.2s; pointer-events: none; }
.mic.on { color: var(--hot); filter: drop-shadow(0 0 6px var(--c)); }
.mic.on::after { opacity: 0.8; }
.ask .mic { border-left: 0; }
#reply .q.heard { color: var(--text); }
#open-chat:hover, #open-chat:focus-visible { color: var(--hot); outline: none; }
/* the buttons are cells between vertical lines (quick job 22): each fills its cell, from its own line to the
   next line (no flex gap between them) or to the bar's right edge (no padding after the last), so the icon
   sits in the middle of what you see; an empty count takes no room */
#ask-btn .in > button { align-self: stretch; }
#ask-btn .in > button:not([hidden]) ~ button { margin-left: -0.55rem; }
#ask-btn .in { padding-right: 0; }
#open-chat { min-width: 2.6rem; }
#open-chat b:empty { display: none; }
/* the latest answer, under the core: typed out, then fades after a while; tap it to see the whole conversation */
#reply { position: absolute; top: calc(50% + min(var(--orb), 100%) / 2 + 4.2rem); left: 50%; transform: translateX(-50%); width: min(34rem, 80vw); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.6s; }
#reply.on { opacity: 1; pointer-events: auto; cursor: pointer; }
/* conversation mode (quick job 68): a clear, calm sign above the core while it keeps listening */
#conv-sign { position: absolute; bottom: calc(50% + min(var(--orb), 100%) / 2 + 1.6rem); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 0.55rem; padding: 0.35rem 0.9rem;
  border: 1px solid var(--c); background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--hot); font: 500 max(11px, 0.82rem)/1.2 var(--f-ui); letter-spacing: 0.04em; white-space: nowrap;
  box-shadow: 0 0 14px color-mix(in srgb, var(--c) 35%, transparent); }
#conv-sign[hidden] { display: none; }
#conv-sign i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); animation: wdot 2.4s ease-in-out infinite; }
#conv-btn[aria-pressed="true"] { color: var(--hot); background: color-mix(in srgb, var(--c) 18%, transparent); }
#reply .q { font: var(--w-lines) max(11px, 0.78rem)/1.4 var(--f-lines); color: var(--text-dim); margin-bottom: 0.35rem; }
#reply .a { font: 500 1rem/1.5 var(--f-ui); color: var(--text); text-shadow: 0 0 12px var(--bg), 0 0 4px var(--bg);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }  /* longer answers: tap for the whole conversation */
#reply .a .code { font: 400 0.85em var(--f-mono); color: var(--c); }
/* visitor mode (quick job 35): the "try this" cards are modules beside the core (quick job 161; before, a row
   above the core). They stand out: a bright edge, a light inside and a "Try this" label. One that asks something
   is a button; one that's only read is quieter. */
.mod.try .cut { background: color-mix(in srgb, var(--hot) 70%, var(--c)); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 35%, transparent); }
.mod.try .in { background: color-mix(in srgb, var(--surface) 78%, color-mix(in srgb, var(--c) 22%, transparent)); }
.mod.try .txt { min-width: 0; display: grid; gap: 0.2rem; }
.mod.try .tag { font: 700 max(11px, 0.66rem)/1 var(--f-title); letter-spacing: 0.18em; text-transform: uppercase; color: var(--hot); }
.mod.try b { font: 600 1rem/1.25 var(--f-ui); color: var(--text); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.mod.try small { font: var(--w-lines) max(11px, 0.78rem)/1.3 var(--f-lines); color: var(--text-dim); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.mod.try.read { cursor: default; }
.mod.try.read .cut { background: color-mix(in srgb, var(--c) 45%, transparent); box-shadow: none; }
button.mod.try:hover b, button.mod.try:focus-visible b { color: var(--hot); }
body[data-layout="panels"] #ask-btn { display: none; }
/* what went wrong shows under the core, where the answer would be (quick job 154: it covered the core) */
#errmsg { position: absolute; top: calc(50% + min(var(--orb), 100%) / 2 + 4.2rem); left: 50%; transform: translateX(-50%); width: min(92vw, 26rem); display: none; z-index: 2; }
[data-state="error"] #reply { visibility: hidden; }
#errmsg b { display: block; font: 600 0.95rem/1.3 var(--f-ui); color: var(--text); }
#errmsg span { display: block; font: var(--w-lines) max(11px, 0.78rem)/1.4 var(--f-lines); color: var(--text-dim); margin-top: 0.2rem; }
[data-state="error"] #errmsg { display: block; }
#errmsg .in { display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.7rem; align-items: center; padding: 0.55rem 0.8rem; font: 500 max(11px, 0.85rem)/1.35 var(--f-ui); }
#errmsg .ico { width: 1.6rem; height: 1.6rem; color: var(--danger); }

/* the core's dock: while a module is open the core moves here, so it stays visible and alive */
#orb-dock { position: fixed; z-index: 7; pointer-events: none; display: none; }
#orb-dock #orb { width: 100%; }
body[data-mod] #orb-dock { display: block; }
body[data-mod="chat"] #orb-dock { left: 9vw; top: 50%; width: min(58vh, 34vw); translate: 0 -50%; }
body[data-mod]:not([data-mod="chat"]) #orb-dock { right: calc(5vw + 1.4rem); bottom: calc(5vh + 1.4rem); width: var(--dock); }
/* the System diagram has its own core: the docked one would be a second (quick job 154) */
body[data-view="system"] #orb-dock { display: none; }
/* the docked core works on an open page too (2026-11-14): hold it to talk; what it hears and says shows beside it */
body[data-mod]:not([data-mod="chat"]) #orb-dock.talk { pointer-events: auto; cursor: pointer; touch-action: none; }
#dock-say { position: fixed; z-index: 7; display: none; pointer-events: none; right: calc(5vw + 2.2rem + var(--dock)); bottom: calc(5vh + 1.4rem); width: min(24rem, 40vw); }
body[data-mod]:not([data-mod="chat"]) #dock-say { display: block; }
#dock-say #reply { position: static; transform: none; width: auto; text-align: right; padding: 0.6rem 0.8rem; background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line); clip-path: polygon(0.6rem 0, 100% 0, 100% calc(100% - 0.6rem), calc(100% - 0.6rem) 100%, 0 100%, 0 0.6rem); }
#dock-say #reply .a { max-height: 6.5em; overflow: hidden; }

/* boot-only elements */
#boot-title-wrap { position: fixed; left: 0; right: 0; top: 11vh; text-align: center; z-index: 7; pointer-events: none; }
#boot-title { display: inline-block; transform-origin: 0 0; font: 700 clamp(26px, 4vw, 58px)/1 var(--f-title); text-transform: uppercase; color: var(--hot); letter-spacing: 0.7em; opacity: 0; white-space: nowrap; text-shadow: 0 0 14px var(--c), 0 0 40px color-mix(in srgb, var(--c) 40%, transparent); transition: letter-spacing 1.2s var(--arrive), opacity 0.4s; }
#boot-title.on { letter-spacing: 0.16em; opacity: 1; }
#boot-greet { position: fixed; left: 0; right: 0; top: calc(11vh + clamp(26px, 4vw, 58px) + 1.4rem); text-align: center; z-index: 7; pointer-events: none; min-height: 1.4em;
  padding: 0 16px; font: 500 clamp(15px, 1.25vw, 26px)/1.4 var(--f-title); letter-spacing: 0.1em; color: var(--text); text-shadow: 0 0 12px var(--bg); transition: opacity 0.6s, translate 0.8s var(--leave); }
#boot-greet.leave { opacity: 0; translate: 0 -0.8rem; }
#boot-greet.typing::after { height: 0.9em; }
#bootlines { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(90vw, 24rem); z-index: 7; font: var(--w-lines) max(11px, 0.85rem)/1.65 var(--f-lines); color: var(--text); transition: opacity 0.8s, transform 1s var(--arrive); pointer-events: none; }
#bootlines div { position: relative; display: flex; justify-content: space-between; gap: 0.7rem; white-space: nowrap; animation: rowin 0.4s var(--arrive) both; }
#bootlines div::after { content: ""; position: absolute; top: 15%; bottom: 15%; width: 2px; background: var(--hot); box-shadow: 0 0 8px var(--c), 0 0 2px var(--hot); animation: rowscan 0.45s var(--arrive) both; pointer-events: none; }
#bootlines .lead { flex: 1; align-self: center; height: 0; margin-top: 0.15em; border-bottom: 1px dotted color-mix(in srgb, var(--c) 50%, transparent); transform: scaleX(0); transform-origin: left; transition: transform 0.3s var(--arrive); }
#bootlines .led .lead { transform: none; }
#bootlines .v.pop { animation: vpop 0.6s ease-out 1; }
/* corner brackets around the checks */
#bootlines::before, #bootlines::after { content: ""; position: absolute; width: 0.8rem; height: 0.8rem; border: 0 solid color-mix(in srgb, var(--c) 70%, transparent); transition: opacity 0.4s, inset 0.6s var(--arrive); opacity: 0; }
#bootlines::before { left: -1.4rem; top: -1rem; border-width: 1px 0 0 1px; }
#bootlines::after { right: -1.4rem; bottom: -1rem; border-width: 0 1px 1px 0; }
#bootlines:not(:empty)::before, #bootlines:not(:empty)::after { opacity: 1; }
#bootlines:not(:empty)::before { left: -0.8rem; top: -0.6rem; }
#bootlines:not(:empty)::after { right: -0.8rem; bottom: -0.6rem; }
@keyframes rowin { from { clip-path: inset(0 100% 0 0); translate: -10px 0; } to { clip-path: inset(0 -20px 0 0); translate: 0 0; } }
@keyframes rowscan { from { left: 0; opacity: 1; } to { left: 100%; opacity: 0; } }
@keyframes vpop { 0% { color: var(--hot); text-shadow: 0 0 10px var(--c), 0 0 2px var(--hot); } 100% { text-shadow: none; } }

#bootlines .k .ico { color: var(--c); }
#bootlines .v { color: var(--c); }
#bootlines .v.no { color: var(--offline); }
#flash { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; }
#flash.crt { animation: crt 0.75s var(--arrive) 1; }
#flash.white { animation: whiteflash 0.9s ease-out 1; }
/* the hyperspace flash and impact frame are drawn on their own canvas: a full-screen CSS layer fading over
   the busy network glitched (parts of it didn't draw). Impact frame: dark lines on white, never red. */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; }
/* the startup as a video (quick job 34, ⚙ → This device): a recording plays over the drawn layers, which aren't
   drawn meanwhile; the words (start screen, title, checks, greeting) stay live above it, then the live hub takes over */
#startup-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 9; pointer-events: none; display: none; opacity: 0; background: var(--bg); }

#shock { position: fixed; z-index: 1; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; pointer-events: none; }
#shock.go { animation: shock 1.6s var(--arrive) 1; }

/* chat: you on the right in a broken-edged box, the assistant on the left. No name labels. */

/* typed log */

/* arm readouts (panels layout) */

.j b { display: block; font: var(--w-lines) max(11px, 0.62rem)/1.2 var(--f-lines); color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

body[data-alert="held"] .arm { --c: var(--text-dim); }

/* launcher side panels: a value and an icon, not a sentence */
.side { display: flex; flex-direction: column; gap: 1.9rem; align-self: center; min-width: 0; }

.head .n { font: max(11px, 0.8rem)/1 var(--f-digits); color: var(--text-dim); }
.head .grow { margin-left: auto; }
/* each panel says what it is in a few words: icon + small CAPS title; numbers carry their unit */
.cap { font: 500 max(11px, 0.66rem)/1 var(--f-ui); letter-spacing: var(--label-spacing, 0.12em); text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }
.head .n.grow, .head .meta { margin-left: auto; }

.meta b { font: 600 max(11px, 0.8rem)/1 var(--f-ui); color: var(--c); }

.thin .k { font: 500 max(11px, 0.6rem)/1 var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); margin-right: 0.2rem; }
/* callout panels: the title sits on a line, plain words; the content sits under it on a see-through fill.
   No icon + CAPS title + big number tiles: that's the stock dashboard look. */
.side .cut, .side .cut > .in { background: none; clip-path: none; padding: 0; }
.side .cut > .in { position: relative; isolation: isolate; padding: 0 1.15rem 1.05rem; gap: 0.6rem; }
/* the fill starts just under the line and is a touch brighter there, like light falling from the line */
.side .in::before { content: ""; position: absolute; inset: calc(1.75rem + 3px) 0 0 0; z-index: -1;
  background: linear-gradient(color-mix(in srgb, var(--c) 7%, transparent), transparent 2.5rem), color-mix(in srgb, var(--surface) 80%, transparent);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 0.7rem), calc(100% - 0.7rem) 100%, 0 100%); }
.side .head { position: relative; height: 1.75rem; margin: 0 -1.15rem 0.55rem; padding: 0; align-items: flex-end; border-bottom: 1px solid color-mix(in srgb, var(--c) 55%, transparent); }
.side .head::after { content: ""; position: absolute; bottom: -3px; width: 5px; height: 5px; background: var(--c); }
.side.left .head::after { right: -3px; }
.side.right .head::after { left: -3px; }
.side .cap { font: 500 0.95rem/1 var(--f-ui); letter-spacing: 0.03em; text-transform: none; color: var(--c); }
/* the title tab: open at the bottom (the line is its floor), the corner facing the core cut, a faint fill */
.side .cap { --tab: color-mix(in srgb, var(--c) 55%, transparent); display: inline-flex; align-items: center; height: 1.6rem; padding: 0 0.85rem 0 0.7rem;
  border: 1px solid var(--tab); border-bottom: 0; background-origin: border-box;
  background: linear-gradient(to bottom left, transparent calc(50% - 0.7px), var(--tab) 50%, transparent calc(50% + 0.7px)) right top / 0.6rem 0.6rem no-repeat,
    linear-gradient(color-mix(in srgb, var(--c) 16%, transparent), color-mix(in srgb, var(--c) 4%, transparent));
  clip-path: polygon(0 0, calc(100% - 0.6rem) 0, 100% 0.6rem, 100% 100%, 0 100%); }
.side.right .cap { padding: 0 0.7rem 0 0.85rem; clip-path: polygon(0.6rem 0, 100% 0, 100% 100%, 0 100%, 0 0.6rem);
  background: linear-gradient(to bottom right, transparent calc(50% - 0.7px), var(--tab) 50%, transparent calc(50% + 0.7px)) left top / 0.6rem 0.6rem no-repeat,
    linear-gradient(color-mix(in srgb, var(--c) 16%, transparent), color-mix(in srgb, var(--c) 4%, transparent)); }
/* full and maximal: a bright notch on the tab's top edge */
body:is(.q-full, .q-maximal) .side.left .cap { border-top-color: transparent; background-image: linear-gradient(var(--c), var(--c)), linear-gradient(var(--tab), var(--tab)),
    linear-gradient(to bottom left, transparent calc(50% - 0.7px), var(--tab) 50%, transparent calc(50% + 0.7px)), linear-gradient(color-mix(in srgb, var(--c) 16%, transparent), color-mix(in srgb, var(--c) 4%, transparent));
  background-size: 1rem 2px, 100% 1px, 0.6rem 0.6rem, auto; background-position: left top, left top, right top, 0 0; background-repeat: no-repeat; }
body:is(.q-full, .q-maximal) .side.right .cap { border-top-color: transparent; background-image: linear-gradient(var(--c), var(--c)), linear-gradient(var(--tab), var(--tab)),
    linear-gradient(to bottom right, transparent calc(50% - 0.7px), var(--tab) 50%, transparent calc(50% + 0.7px)), linear-gradient(color-mix(in srgb, var(--c) 16%, transparent), color-mix(in srgb, var(--c) 4%, transparent));
  background-size: 1rem 2px, 100% 1px, 0.6rem 0.6rem, auto; background-position: right top, left top, left top, 0 0; background-repeat: no-repeat; }
.side.right .head { flex-direction: row-reverse; }
/* a callout opens its details full-screen: tap anywhere on it (not on its own controls), or the open mark by the tab */
.side .panel[data-detail] { cursor: pointer; }
.side .open { align-self: center; display: grid; place-items: center; width: 1.9rem; height: 1.6rem; margin: 0 0.25rem; padding: 0; border: 0; background: none; color: var(--text-dim); font-size: 0.95rem; cursor: pointer; transition: color 0.15s; }
.side .panel[data-detail]:hover .cap, .side .panel[data-detail]:focus-within .cap { --tab: var(--c); color: var(--hot); }
.side .panel[data-detail]:hover .open, .side .open:focus-visible { color: var(--hot); outline: none; }

body:is(.q-full, .q-maximal) .side .head::before { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 6px; pointer-events: none;
  background: linear-gradient(var(--c), var(--c)) var(--lead, left) bottom / 2.2rem 2px no-repeat,
    repeating-linear-gradient(90deg, var(--c) 0 1px, transparent 1px 5px) var(--tick, right 0.9rem) bottom 0 / 1.6rem 5px no-repeat; }
body.q-maximal .side .head::before { background: linear-gradient(var(--c), var(--c)) var(--lead, left) bottom / 2.2rem 2px no-repeat,
    repeating-linear-gradient(90deg, var(--c) 0 1px, transparent 1px 5px) var(--tick, right 0.9rem) bottom 0 / 1.6rem 5px no-repeat,
    repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 60%, transparent) 0 1px, transparent 1px 4px) var(--hatch, left 58%) bottom 2px / 1.4rem 4px no-repeat; }
.side.right .head { --lead: right; --tick: left 0.9rem; --hatch: left 42%; }
.side .big { font: 600 1.1rem/1.25 var(--f-ui); }
.prog { display: flex; align-items: center; gap: 0.8rem; }
.prog .steps { flex: 1; }
.stepn { font: var(--w-lines) max(11px, 0.78rem)/1 var(--f-lines); color: var(--text-dim); white-space: nowrap; }
.next { display: flex; align-items: center; gap: 0.65rem; font: 500 0.98rem/1.3 var(--f-ui); color: var(--text); margin-top: 0.15rem; }
.next .k { font: 600 max(11px, 0.82rem)/1 var(--f-ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--c); }
/* a pixel double chevron between "Next" and the step; light runs through it now and then */
.next .chev { width: 0.95rem; height: 0.7rem; flex: none; color: var(--c); shape-rendering: crispEdges; overflow: visible; }
.next .chev rect { fill: currentColor; opacity: 0.45; animation: chevrun 3.2s steps(1) infinite; animation-delay: calc(var(--i) * 0.12s); }
@keyframes chevrun { 0%, 70% { opacity: 0.45; } 74%, 82% { opacity: 1; } }
.row2 { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; font: var(--w-lines) max(11px, 0.78rem)/1.3 var(--f-lines); color: var(--text-dim); }
.row2 .k { color: var(--c); }
.row2 .tot { font: 1.3rem/1 var(--f-digits); color: var(--hot); margin-right: 0.2rem; }
#devcount { white-space: nowrap; }
#devcount b { font: 600 max(11px, 0.85rem)/1 var(--f-ui); color: var(--c); }
.range { display: flex; gap: 2px; }
.range button { font: 500 max(11px, 0.7rem)/1 var(--f-ui); color: var(--text-dim); background: none; border: 1px solid var(--line); padding: 0.2rem 0.4rem; cursor: pointer; }
.range button[aria-pressed="true"] { color: var(--bg); background: var(--c); border-color: var(--c); }
.axis { display: flex; justify-content: space-between; font: var(--w-lines) max(11px, 0.6rem)/1 var(--f-lines); color: var(--text-dim); margin-top: -0.2rem; }
.big { font: 600 0.95rem/1.25 var(--f-ui); }
.thin { display: flex; align-items: center; gap: 0.35rem; font: var(--w-lines) max(11px, 0.75rem)/1.4 var(--f-lines); color: var(--text-dim); }
.thin .ico { color: var(--c); flex: none; }
.money { font: 1.35rem/1 var(--f-digits); color: var(--hot); white-space: pre; }
.money small { font: var(--w-lines) 0.55em/1 var(--f-lines); color: var(--text-dim); margin-left: 0.5rem; }
.meter { height: 6px; background: var(--line); position: relative; }
.how { font: var(--w-lines) max(11px, 0.7rem)/1.3 var(--f-lines); color: var(--text-dim); }
.meter::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--fill, 0%); min-width: 2px; background: var(--c); }
#spark { width: 100%; height: 3.4rem; overflow: visible; color: var(--c); }
#spark text { font: 11px var(--f-mono); fill: var(--text-dim); }
#devgraph { width: 100%; height: 7.2rem; overflow: visible; transition: height 0.5s var(--arrive), opacity 0.4s; }
#devgraph text { font: 300 9px var(--f-lines); fill: var(--text-dim); }
#devgraph .on { stroke: var(--c); }

.devices[data-view="hive"] #devgraph { height: auto; }

#devgraph .node:hover .hx, #devgraph .node:focus-visible .hx, #devgraph .node:hover circle, #devgraph .node:focus-visible circle { stroke: var(--hot); stroke-width: 2; }
#devgraph .hx.on { fill: var(--c); fill-opacity: 0.75; stroke: var(--c); }

@keyframes beat { 0%, 86%, 100% { fill-opacity: 0.75; } 92% { fill-opacity: 1; stroke: var(--hot); } }

#devlist { display: none; max-height: 16rem; overflow-y: auto; }
#devlist table { width: 100%; border-collapse: collapse; font: max(11px, 0.88rem)/1.2 var(--f-ui); }
#devlist thead th { font: 500 max(11px, 0.68rem)/1 var(--f-ui); color: var(--text-dim); text-align: left; padding: 0 0.3rem 0.3rem; }
#devlist thead th .ico, #devlist td .ico { font-size: 1rem; }
#devlist tr.g th { font: 500 max(11px, 0.68rem)/1 var(--f-ui); letter-spacing: 0.08em; color: var(--text-dim); text-align: left; padding: 0.55rem 0.3rem 0.2rem; border-bottom: 1px solid var(--line); }
#devlist td { padding: 0.3rem; vertical-align: middle; }
#devlist td:first-child { width: 1.2rem; color: var(--text-dim); }
#devlist td small { display: block; font: var(--w-lines) max(11px, 0.7rem)/1.2 var(--f-lines); color: var(--text-dim); }
#devlist tr[data-dev] { cursor: pointer; outline: none; }
#devlist tr[data-dev]:hover, #devlist tr[data-dev]:focus-visible { background: color-mix(in srgb, var(--c) 12%, transparent); }
#devlist .st { color: var(--offline); }

.devices[data-open="1"] #devgraph { display: none; }
.devices[data-open="1"] #devlist { display: block; overflow-y: auto; }
.devmore .ico { rotate: 180deg; }
.devices[data-open="1"] .devmore .ico { rotate: 0deg; }
/* beside the count, on the right: a framed button sized to its words, still big enough for a finger */
.devices .row2 { align-items: center; }
.devmore { display: inline-flex; align-items: center; gap: 0.4rem; margin-left: auto; min-height: 2.3rem; padding: 0 0.6rem 0 0.8rem; white-space: nowrap;
  font: 500 max(11px, 0.82rem)/1 var(--f-ui); letter-spacing: 0.04em; color: var(--c); background: color-mix(in srgb, var(--c) 7%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); cursor: pointer; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 0.45rem), calc(100% - 0.45rem) 100%, 0 100%); }
.devmore .ico { font-size: 1.1rem; transition: rotate 0.3s var(--arrive); }
#devsys { padding: 0; width: 2.3rem; justify-content: center; }
#devsys .ico { rotate: 0deg; }
#devsys + #devtoggle { margin-left: 0.5rem; }
/* the system diagram (quick job 12): drawn by hub/system-diagram.js, as big as the page allows */
#mod-slot .sysbox { flex: 1; min-width: 0; display: grid; place-items: center; padding: 0.4rem 0 0; }
#mod-slot .sysbox svg { width: 100%; height: 100%; max-height: 100%; }
.devmore:hover, .devmore:focus-visible { color: var(--hot); background: color-mix(in srgb, var(--c) 16%, transparent); border-color: var(--c); outline: none; }
/* the list scrolls inside a capped height; a fade at the bottom shows there's more */
.devwrap { position: relative; }
.devices:not([data-open="1"]) .devwrap::after { display: none; }
.devwrap.more::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3rem; pointer-events: none;
  background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 92%, transparent)); }
#devlist { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--c) 55%, transparent) transparent; padding-right: 0.3rem; }
#devlist::-webkit-scrollbar { width: 6px; }
#devlist::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--c) 55%, transparent); }
/* statuses are words with a dot: they read as facts, not as buttons */
/* the name takes the space that's left and shortens with "…"; status columns never wrap */
#devlist td:nth-child(2) { width: 100%; max-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#devlist td:nth-child(n+3), #devlist th { white-space: nowrap; }
#devlist .sw { display: inline-flex; align-items: center; gap: 0.4rem; font: var(--w-lines) max(11px, 0.8rem)/1 var(--f-lines); color: var(--offline); white-space: nowrap; }
#devlist .sw i { width: 0.45rem; height: 0.45rem; border-radius: 50%; border: 1px solid currentColor; flex: none; }
#devlist .sw.ok { color: var(--text); }
#devlist .sw.ok i { background: var(--c); border-color: var(--c); box-shadow: 0 0 6px var(--c); }
#devlist .sw.lock { color: var(--accent); }
#devlist .sw.lock .ico { font-size: max(11px, 0.85rem); }
/* the device card's action: a real (framed) button, big enough to press */
#devcard .act { margin-top: 0.4rem; min-height: 2.4rem; font: 500 max(11px, 0.85rem)/1 var(--f-ui); color: var(--c); background: color-mix(in srgb, var(--c) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); cursor: pointer; }
#devcard .act:hover, #devcard .act:focus-visible { color: var(--hot); border-color: var(--c); outline: none; }
#devcard .act:disabled { color: var(--offline); border-color: var(--line); background: none; cursor: default; }
#devcard .act.busy { animation: pulse 0.8s ease-in-out infinite; }
/* one device's details, next to where it was tapped */
#devcard { position: fixed; z-index: 8; width: min(17rem, calc(100vw - 32px)); }
#devcard[hidden] { display: none; }
#devcard .cut { background: color-mix(in srgb, var(--c) 55%, transparent); }
#devcard .in { background: color-mix(in srgb, var(--bg) 94%, transparent); padding: 0.75rem 0.9rem; display: grid; gap: 0.35rem; font: var(--w-lines) max(11px, 0.8rem)/1.4 var(--f-lines); color: var(--text-dim); }
#devcard .t { display: flex; align-items: center; gap: 0.5rem; font: 600 1rem/1.2 var(--f-ui); color: var(--text); }
#devcard .t .ico { color: var(--c); font-size: 1.2rem; }
#devcard .t button { margin-left: auto; background: none; border: 0; color: var(--text-dim); font: 1.1rem/1 var(--f-ui); cursor: pointer; }
#devcard .row { display: flex; align-items: center; gap: 0.45rem; }
#devcard .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--offline); flex: none; }
#devcard .row.on .dot { background: var(--c); box-shadow: 0 0 6px var(--c); }
#devcard .row.on { color: var(--text); }
#devcard .row.lock { color: var(--text); }
#devcard .row.lock .ico { color: var(--accent); flex: none; }
#devcard dl { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.8rem; margin: 0.2rem 0 0; font-size: max(11px, 0.75rem); }
#devcard dt { color: var(--text-dim); }
#devcard dd { margin: 0; color: var(--text); font-family: var(--f-mono); font-size: max(11px, 0.72rem); }
#devgraph .hx.net { fill: transparent; stroke: var(--c); }
#devlist small { color: var(--text-dim); margin-left: 0.3rem; }
#devcard .ex { font-size: max(11px, 0.68rem); opacity: 0.7; }

/* alert toast */
#toast { position: absolute; top: 1%; left: 50%; transform: translate(-50%, -8px); width: min(92%, 24rem); max-width: calc(100vw - 1.6rem); overflow-wrap: anywhere; opacity: 0; transition: opacity 0.4s, transform 0.5s var(--arrive); pointer-events: none; z-index: 3; }
#toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }  /* its tooltip shows the details */
#toast.on.nudge { animation: nudge 0.6s var(--arrive); }
@keyframes nudge { 0% { transform: translate(-50%, -10px); filter: brightness(1.8); } 100% { transform: translate(-50%, 0); } }
#toast .in { display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.8rem; align-items: center; padding: 0.55rem 0.9rem 0.55rem 0.7rem; }
#toast .ico { width: 2.2rem; height: 2.2rem; color: var(--c); filter: drop-shadow(0 0 5px var(--c)); stroke-width: 1.8; }
#toast .msg-t { font: 500 0.9rem/1.35 var(--f-ui); }
body[data-alert="warning"] #toast { animation: warnpulse 2s ease-in-out infinite; }
body[data-alert="critical"] #toast { animation: critpulse 0.667s ease-in-out infinite; }
#edge { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0; box-shadow: inset 0 0 110px 14px var(--danger), inset 0 0 18px 2px var(--danger); }
body[data-mood="room"][data-alert="critical"] #edge { animation: edgepulse 0.667s ease-in-out infinite; }
body.q-minimal[data-mood="room"][data-alert="critical"] #edge { opacity: 0.55; }
body.jolt #hub { animation: jolt 0.42s steps(2) 1; }

/* reticle (idle event) */
#reticle { position: fixed; z-index: 4; pointer-events: none; opacity: 0; color: var(--c); transition: all 0.55s var(--arrive); }
#reticle i { position: absolute; width: 14px; height: 14px; border: 0 solid currentColor; }
#reticle i:nth-child(1) { left: 0; top: 0; border-left-width: 2px; border-top-width: 2px; }
#reticle i:nth-child(2) { right: 0; top: 0; border-right-width: 2px; border-top-width: 2px; }
#reticle i:nth-child(3) { left: 0; bottom: 0; border-left-width: 2px; border-bottom-width: 2px; }
#reticle i:nth-child(4) { right: 0; bottom: 0; border-right-width: 2px; border-bottom-width: 2px; }

/* module page, unfolds from its button */
#module { position: fixed; inset: 0; z-index: 6; pointer-events: none; clip-path: inset(50% 50% 50% 50%); transition: clip-path 0.7s var(--arrive); visibility: hidden; }
#module.open { pointer-events: auto; visibility: visible; }
#module.closing { pointer-events: none; }
#module > .cut { position: absolute; inset: 5vh 5vw; --cut: 1.2rem; }
#module > .cut > .in { position: relative; }
body[data-mod="chat"] #module > .cut > .in { background: color-mix(in srgb, var(--bg) 90%, transparent); }
#mod-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
/* the content starts under the title's left edge; the page spans the whole module and the docked core floats over
   its bottom-right corner (quick job 160; before, the core kept that corner and a column above it stayed empty) */
#mod-slot { position: absolute; inset: 3.9rem 1.7rem 1.4rem; display: flex; pointer-events: none; }
body[data-mod="chat"] #mod-slot { left: calc(9vw + min(58vh, 34vw) - 5vw + 3vw); right: 4%; }
#mod-slot > * { pointer-events: auto; }
#mod-slot .chat { flex: 1; width: 100%; max-width: 50rem; margin: 0 auto; }
#mod-slot .chat.panel { opacity: 1; clip-path: none; }
#mod-empty { position: absolute; inset: 0; display: none; place-items: center; color: var(--line); font-size: 7rem; }
#mod-empty .ico { stroke-width: 0.6; }
body[data-mod="empty"] #mod-empty { display: grid; }
/* the title, then "Open on…" with its drop-down; × alone at the top right (choice 2) */
#module .mod-head { position: absolute; left: 1.7rem; top: 0.8rem; right: calc(2.4rem + max(2.6rem, 44px)); height: max(2.6rem, 44px); display: flex; align-items: center; gap: 1.4rem; min-width: 0; }
#module .tab { min-width: 0; display: flex; align-items: center; gap: 0.7rem; font: 700 1.1rem/1 var(--f-title); letter-spacing: 0.18em; color: var(--hot); text-transform: uppercase; }
#module .tab .ico { color: var(--c); font-size: 1.25rem; }
#module .back { position: absolute; right: 1.2rem; top: 0.8rem; display: flex; align-items: center; justify-content: center; width: max(2.6rem, 44px); height: max(2.6rem, 44px); font-size: 1.3rem; color: var(--text); background: transparent; border: 1px solid var(--line); padding: 0; cursor: pointer; }
#module .back:hover, #module .back:focus-visible { border-color: var(--c); color: var(--hot); outline: none; }
body.folded #hub { transform: scale(0.93); opacity: 0.12; filter: blur(2px); }
/* depth (quick job 158, choice 6: light, not shadow first). The layer behind dims and blurs, like a camera's
   focus; the core in front grows a little and casts a faint light of its own colour on what is behind it. */
body:is(.q-full, .q-maximal).folded #hub { filter: blur(3px); }
body:is(.q-full, .q-maximal) #net { transition: opacity 0.7s; }
body:is(.q-full, .q-maximal).folded #net { opacity: 0.45; }
body:is(.q-full, .q-maximal) #orb-dock::before { content: ""; position: absolute; inset: -45%; z-index: -1; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 16%, transparent), color-mix(in srgb, var(--c) 5%, transparent) 60%, transparent);
  opacity: 0; transition: opacity 0.15s; }
/* the light goes first when a page closes, so it never trails the core over the hub (quick job 161) */
body:is(.q-full, .q-maximal).folded #orb-dock::before { opacity: 1; transition: opacity 0.5s 0.3s; }
body:is(.q-full, .q-maximal)[data-mod] #orb-dock { scale: 1.08; }
/* minimal: a plain fill and a short fade, no blur and no scale (quick job 154) */
body.q-minimal #hub { transition: opacity 0.15s; }
body.q-minimal.folded #hub { transform: none; filter: none; opacity: 0.08; }

/* details: a callout opened full-screen. Same callout shapes, more room: the whole story behind the panel */
#mod-slot .detail { flex: 1; width: 100%; max-width: 66rem; margin: 0 auto; overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 2rem 3.2rem; align-content: start; padding: 1.2rem 0.4rem 1rem; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--c) 55%, transparent) transparent; }
#mod-slot .detail.wide { grid-template-columns: minmax(0, 1fr); }
.detail .d-big { font: 600 1.6rem/1.2 var(--f-ui); color: var(--hot); }
.detail p { margin: 0.6rem 0 0; font: var(--w-lines) 0.95rem/1.55 var(--f-lines); color: var(--text-dim); }
.detail p b { color: var(--text); font-weight: 500; }
.detail .d-num { display: flex; align-items: baseline; gap: 0.6rem; margin-top: 1.4rem; font: 3.2rem/1 var(--f-digits); color: var(--hot); }
.detail .d-num small { font: var(--w-lines) 1rem/1 var(--f-lines); color: var(--text-dim); }
.detail .d-line { height: 1.75rem; display: flex; align-items: flex-end; border-bottom: 1px solid color-mix(in srgb, var(--c) 55%, transparent); margin-bottom: 0.9rem; font: 500 1rem/1 var(--f-ui); color: var(--c); padding-bottom: 0.35rem; }
.d-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.25rem; }
.d-steps li { display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 0.8rem; align-items: center; padding: 0.55rem 0.8rem 0.55rem 0.6rem; border-left: 2px solid var(--line); }
.d-steps .n { font: 1.1rem/1 var(--f-digits); color: var(--text-dim); text-align: right; }
.d-steps b { display: block; font: 500 1rem/1.25 var(--f-ui); color: var(--text); }
.d-steps small { display: block; font: var(--w-lines) max(11px, 0.8rem)/1.4 var(--f-lines); color: var(--text-dim); }
.d-steps .w { font: 600 max(11px, 0.72rem)/1 var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); }
.d-steps li.now { border-left-color: var(--c); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, transparent), transparent 70%); }
.d-steps li.now .n { color: var(--hot); }
.d-steps li.later b { color: var(--text-dim); font-weight: 400; }
.d-chart { width: 100%; height: auto; overflow: visible; color: var(--c); }
.d-chart text { font: 300 11px var(--f-lines); fill: var(--text-dim); }
.d-chart .num { font: 11px var(--f-digits); fill: var(--hot); }
.d-stats { display: flex; flex-wrap: wrap; gap: 1.2rem 2.4rem; margin-top: 1.2rem; }
.d-stats div { font: var(--w-lines) max(11px, 0.85rem)/1.3 var(--f-lines); color: var(--text-dim); }
.d-stats b { display: block; font: 1.7rem/1.1 var(--f-digits); color: var(--hot); margin-bottom: 0.2rem; }
.d-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.7rem; }
.d-list li { display: grid; grid-template-columns: 4.2rem 1fr; gap: 0.8rem; font: 500 0.92rem/1.35 var(--f-ui); color: var(--text); }
.d-list li span { font: var(--w-lines) max(11px, 0.8rem)/1.6 var(--f-lines); color: var(--text-dim); }
.d-table { width: 100%; border-collapse: collapse; font: 0.92rem/1.25 var(--f-ui); }
.d-table th { font: 500 max(11px, 0.72rem)/1 var(--f-ui); color: var(--text-dim); text-align: left; padding: 0 0.6rem 0.5rem; white-space: nowrap; }
.d-table td { padding: 0.5rem 0.6rem; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); vertical-align: middle; }
.d-table td.num { font-family: var(--f-digits); color: var(--hot); white-space: pre; }
.d-table tr.g th { padding-top: 1.1rem; letter-spacing: 0.08em; border-bottom: 1px solid var(--line); }
.d-table td.mono { font: max(11px, 0.82rem) var(--f-mono); color: var(--text-dim); white-space: nowrap; }
.d-table td small { display: block; font: var(--w-lines) max(11px, 0.75rem)/1.3 var(--f-lines); color: var(--text-dim); }
.d-table tr[data-dev] { cursor: pointer; }
.d-table tr[data-dev]:hover { background: color-mix(in srgb, var(--c) 10%, transparent); }
.detail .sw { display: inline-flex; align-items: center; gap: 0.4rem; font: var(--w-lines) max(11px, 0.85rem)/1 var(--f-lines); color: var(--offline); white-space: nowrap; }
.detail .sw i { width: 0.45rem; height: 0.45rem; border-radius: 50%; border: 1px solid currentColor; flex: none; }
.detail .sw.ok { color: var(--text); }
.detail .sw.ok i { background: var(--c); border-color: var(--c); box-shadow: 0 0 6px var(--c); }
.detail .sw.lock { color: var(--accent); }
.detail .meter { height: 8px; margin-top: 1rem; }
@media (orientation: portrait) { #mod-slot .detail { grid-template-columns: minmax(0, 1fr); } }

/* sleep */
body.sleep #hub > *:not(.core) { opacity: 0.06; transition: opacity 2s; }
body.sleep .mod, body.sleep #ask-btn, body.sleep #cc-launch { opacity: 0.06; transition: opacity 2s; }
body.sleep #toast, body.sleep #verses { opacity: 0; }
body.sleep #frame { opacity: 0.3; }

/* ignition: safe to start, any input */
/* the waiting screen is see-through: the star field behind it is where the hyperspace lines will grow from */
body.waiting #hub, body.waiting #frame, body.waiting #verses, body.waiting #edge, body.waiting #reticle { visibility: hidden; }
#ignite { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: transparent; cursor: pointer; transition: opacity 0.4s; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#ignite.gone { opacity: 0; pointer-events: none; }
#ignite.unlock { pointer-events: none; }
/* the unlock (~1.35 s, then the jump): a wind-up, the bolts pull back one by one, the heavy ring turns and
   opens, the inner ring collapses, the core swells and bursts. Slow-in, slow-out curves give it weight. */
#ignite.unlock #ign-orb { animation: windup 1.45s cubic-bezier(0.45, 0, 0.25, 1) both; }
@keyframes windup { 0% { scale: 1; } 14% { scale: 0.9; } 32% { scale: 1; } 100% { scale: 1.04; } }
#ign-orb .bolt { opacity: 0.8; transition: translate 0.34s cubic-bezier(0.55, 0, 0.2, 1) calc(0.2s + var(--i) * 60ms), opacity 0.35s calc(0.45s + var(--i) * 60ms); }
#ignite.unlock #ign-orb .bolt { translate: 20px 0; opacity: 0; }
#ign-orb .turn { transition: rotate 0.75s cubic-bezier(0.65, 0, 0.25, 1) 0.55s, scale 0.45s cubic-bezier(0.7, 0, 0.84, 0) 1.15s, opacity 0.35s 1.25s; }
#ignite.unlock #ign-orb .turn { rotate: 150deg; scale: 1.7; opacity: 0; }
#ign-orb .shut { transition: scale 0.4s cubic-bezier(0.7, 0, 0.84, 0) 1s, opacity 0.3s 1.15s; }
#ignite.unlock #ign-orb .shut { scale: 0.25; opacity: 0; }
#ign-orb .core-g { transition: scale 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.15s, opacity 0.45s 1.3s; }
#ignite.unlock #ign-orb .core-g { scale: 2.4; opacity: 0; }
#ign-orb .burst { fill: none; stroke: var(--hot); opacity: 0; }
#ignite.unlock #ign-orb .burst { animation: burst 0.8s ease-out 1.2s both; }
@keyframes burst { from { opacity: 1; scale: 1; stroke-width: 3; } to { opacity: 0; scale: 6; stroke-width: 0.4; } }
/* a card swipe (quick job 79): the same unlock, harder (~1.8 s: slowed from
   0.9 s in quick job 136, so that a person can follow it). A scan line reads down the core,
   all the bolts snap back at once, the ring spins open, and the core bursts into the jump. */
#ign-orb .scan { opacity: 0; }
#ign-orb .scan rect { fill: var(--hot); filter: drop-shadow(0 0 4px var(--primary)) drop-shadow(0 0 10px var(--primary)); }
#ignite.card #ign-orb { animation: punch 1.9s cubic-bezier(0.3, 0, 0.2, 1) both; }
@keyframes punch { 0% { scale: 1; } 28% { scale: 0.86; } 42% { scale: 1.08; } 100% { scale: 1.04; } }
#ignite.card #ign-orb .scan { animation: scan 0.6s cubic-bezier(0.5, 0, 0.5, 1) both; }
@keyframes scan { 0% { opacity: 1; translate: 0 -62px; } 85% { opacity: 1; } 100% { opacity: 0; translate: 0 62px; } }
#ignite.card #ign-orb .bolt { transition: translate 0.32s cubic-bezier(0.7, 0, 0.3, 1) 0.52s, opacity 0.4s 0.64s; translate: 26px 0; }
#ignite.card #ign-orb .turn { transition: rotate 0.8s cubic-bezier(0.6, 0, 0.2, 1) 0.64s, scale 0.6s cubic-bezier(0.7, 0, 0.84, 0) 1.24s, opacity 0.5s 1.36s; rotate: 220deg; }
#ignite.card #ign-orb .shut { transition: scale 0.5s cubic-bezier(0.7, 0, 0.84, 0) 1s, opacity 0.4s 1.2s; }
#ignite.card #ign-orb .core-g { transition: scale 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.24s, opacity 0.6s 1.44s; }
#ignite.card #ign-orb .burst { animation: burst 1.2s ease-out 1.32s both; }
#ignite.card #ign-what, #ignite.from #ign-what { transition-delay: 0.6s; }  /* "Card read", "Started from desk" (quick job 139) */
#ignite .stack > *, #ignite .ign-foot { transition: opacity 0.35s, translate 0.5s cubic-bezier(0.7, 0, 0.84, 0); }
#ignite.unlock .stack > *, #ignite.unlock .ign-foot { opacity: 0; translate: 0 14px; }
#ignite.unlock #ign-icons { transition-delay: 0.05s; } #ignite.unlock .safe { transition-delay: 0.1s; }
/* the small core sits exactly in the middle of the screen, where the jump's lines start and the real core lands */
#ign-orb { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: min(8rem, 22vh); height: min(8rem, 22vh); color: var(--primary); overflow: visible; }
#ignite .stack { position: absolute; left: 16px; right: 16px; top: calc(50% + min(6.5rem, 17vh)); display: flex; flex-direction: column; align-items: center; gap: 1.5rem; text-align: center; }
#ign-orb .spin { animation: spin 14s linear infinite; transform-origin: 0 0; }
#ign-orb .spin2 { animation: spin 22s linear infinite reverse; transform-origin: 0 0; }
#ign-orb .pulse { animation: breathe 2.6s ease-in-out infinite; transform-origin: 0 0; }
#ign-what { margin: 0; font: 600 clamp(20px, 1.6rem, 34px)/1.2 var(--f-ui); letter-spacing: 0.06em; color: var(--hot); text-wrap: balance; }
#ign-icons { display: flex; gap: 1.3rem; justify-content: center; color: var(--primary); font-size: 1.8rem; }
#ign-icons .ico { stroke-width: 1.3; }
.safe { display: flex; align-items: center; gap: 0.7rem; margin: 0; max-width: 46ch; font: 300 clamp(15px, 0.95rem, 22px)/1.45 var(--f-lines); color: var(--text); text-align: left; }
.safe .ico { flex: none; font-size: 1.5rem; color: var(--primary); }
.ign-foot { position: absolute; bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; display: flex; justify-content: center; gap: 1.6rem; font: 300 max(11px, 0.8rem)/1 var(--f-lines); color: var(--text-dim); }
.ign-foot .clock { font-size: max(11px, 0.85rem); }
.ign-place { display: inline-flex; align-items: center; gap: 0.45rem; }
.ign-place .ico { color: var(--primary); }
.ign-place:has(#ign-venue:empty) { display: none; }

/* concept controls (not part of the design) */

/* quality */
body.q-reduced #orb .glow { filter: drop-shadow(0 0 4px var(--c)); }
body.q-minimal #orb .glow, body.q-minimal .mod svg, body.q-minimal #frame .hi, body.q-minimal #toast .ico { filter: none !important; }
body.q-minimal .brand, body.q-minimal #boot-title { text-shadow: none; }
body.q-minimal *, body.q-minimal *::before, body.q-minimal *::after { animation: none !important; }
/* minimal is flat (quick job 154): no glow, no light passing, no blur */
body.q-minimal :is(#conv-sign, #conv-sign i, #devlist .sw.ok i, #devcard .row.on .dot, .detail .sw.ok i, #cc-launch .cut) { box-shadow: none; }
body.q-minimal :is(.mic.on, .tool[aria-pressed="true"], #devlist .st.ok, #reply .a) { filter: none; text-shadow: none; }
body.q-minimal #cc-launch .in::after { display: none; }
body.q-minimal #core-dot circle { fill: var(--c); r: 15px; }
body.q-minimal .dd > .cut > .in { backdrop-filter: none; background: var(--bg); }
body.q-minimal .panel { transition: opacity 0.4s; }
body.q-minimal .panel.hold { clip-path: none; }
/* minimal: the rings stay still, and each state has its own still look (choice 3) */
body.q-minimal [data-state="listening"] #orb .rg.on { opacity: 1; }
body.q-minimal [data-state="listening"] #orb { color: color-mix(in srgb, var(--c) 55%, var(--hot)); }
body.q-minimal [data-state="thinking"] #orb #ripple { stroke-dasharray: 6 6; stroke-width: 2.5; }
body.q-minimal [data-state="thinking"] #orb #r-seg .ring { stroke-dasharray: 3 9; }
body.q-minimal [data-state="speaking"] #orb { --c: var(--hot); }

@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 50% { opacity: 0.45; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(1.25); opacity: 0.7; } }
@keyframes warnpulse { 50% { filter: brightness(1.35); } }
@keyframes critpulse { 50% { filter: brightness(1.7); } }
@keyframes edgepulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
@keyframes jolt { 0% { transform: translate(-7px, 2px); } 50% { transform: translate(5px, -3px); } 100% { transform: none; } }
@keyframes crt {
  0% { opacity: 1; background: linear-gradient(transparent calc(50% - 1px), var(--hot) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)); }
  35% { opacity: 1; background: linear-gradient(transparent 30%, color-mix(in srgb, var(--primary) 50%, transparent) 50%, transparent 70%); }
  100% { opacity: 0; background: linear-gradient(transparent 0%, color-mix(in srgb, var(--primary) 10%, transparent) 50%, transparent 100%); }
}
@keyframes whiteflash { 0% { opacity: 0.85; background: var(--hot); } 100% { opacity: 0; background: var(--hot); } }

let COMMITS = [], COMMITS_END = new Date(), COMMIT_RANGES = [7, 14, 30], commitDays = 14;  // per day, oldest first (/api/commits?days=30)
const dayName = (n) => new Date(COMMITS_END - n * 864e5).toLocaleDateString(undefined, { day: "numeric", month: "short" });
function drawSpark(days) {
  commitDays = days;
  // drawn at its real size, so the bars use the whole width and the number stays 11 px (quick job 154)
  const counts = COMMITS.slice(-days), sp = $("#spark"), max = Math.max(1, ...counts), box = sp.getBoundingClientRect();
  const w = Math.round(box.width) || 220, h = Math.round(box.height) || 54;
  sp.innerHTML = ""; sp.setAttribute("viewBox", `0 0 ${w} ${h}`);
  $("#commit-total").textContent = counts.reduce((a, b) => a + b, 0);
  $("#ax0").textContent = dayName(days - 1); $("#ax1").textContent = "Today";
  el("line", { x1: 0, y1: h, x2: w, y2: h, stroke: "var(--line)" }, sp);
  counts.forEach((n, i) => {
    const step = w / counts.length, bw = Math.max(1.5, step - (days > 20 ? 2 : 4)), x = i * step + (step - bw) / 2, bh = Math.max(1, (n / max) * (h - 14));
    el("rect", { x, y: h - bh, width: bw, height: bh, fill: n === max ? "var(--hot)" : "currentColor", opacity: n === max ? 1 : 0.6 }, sp);
    if (n === max) { const lt = el("text", { x: clamp(x + bw / 2, 8, w - 8), y: h - bh - 4, "text-anchor": "middle" }, sp); lt.textContent = String(n); }
  });
  $("#range").innerHTML = COMMIT_RANGES.map((d) => `<button type="button" aria-pressed="${d === days}" data-d="${d}">${d}d</button>`).join("");
  $("#range").querySelectorAll("button").forEach((btn) => btn.addEventListener("click", (e) => { e.stopPropagation(); drawSpark(+btn.dataset.d); SFX.blip(); }));

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function richText(s) {

  return esc(ticks % 2 ? s + "`" : s)
    .replace(/`([^`]+)`/g, '<span class="code">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")

}

  });

// The answer types itself out at a steady pace, like a model writing: the stream arrives in chunks
// (a few words to a whole sentence), so the page reveals them a few characters per frame and speeds up
// when it falls behind. minimal quality shows each chunk at once.
function typewriter(render) {
  let full = "", shown = 0, done = false, resolve;
  const finished = new Promise((r) => (resolve = r));
  const timer = setInterval(() => {
    const behind = full.length - shown;
    if (behind > 0) {
      shown = S.quality === "minimal" ? full.length : Math.min(full.length, shown + Math.max(2, Math.ceil(behind / 60)));  // ~125 chars/s, faster only when far behind
      render(full.slice(0, shown), true);
    } else if (done) {
      clearInterval(timer);
      render(full, false);
      resolve();
    }
  }, 16);
  return { add: (text) => (full += text), end: () => (done = true), finished };
}
// one way in for questions, from the chat page or from the core (typed), or spoken (voice, below): a turn
// shows the question, then the answer as it streams in

  b.type = "button"; b.className = "oo-row dd-row";
  b.innerHTML = `<svg class="ico"><use href="#${icon}"/></svg><span class="oo-name"></span>`;
  b.querySelector(".oo-name").textContent = label;
  b.addEventListener("click", (e) => { e.stopPropagation(); run(); });
  return b;
}
const ddTitle = (text) => Object.assign(document.createElement("p"), { className: "dd-title", textContent: text });
function powerMenu() {
  PMI.replaceChildren(ddTitle("Power"),
    powerRow("Back to the start screen", "i-screen", () => { closePower(); SFX.close(); toStart("the power button"); }),
    powerRow("Shut down lab-os", "i-power", confirmShutDown));
}
async function confirmShutDown() {
  const r = await getJSON("/api/shutdown");
  if (!r?.allowed) { PMI.replaceChildren(ddTitle("Power"), Object.assign(document.createElement("p"), { className: "oo-msg", textContent: r?.why_not || "The brain didn't answer." })); return; }
  const limp = r.limp || [];
  const say = document.createElement("p");
  say.textContent = "Stops any move, lets go of the arm, closes the cameras and microphones and stops the brain. Every screen then says lab-os is off; the \"Start lab-os\" icon starts it again."
    + (limp.length ? ` ${limp.join(" and ")} ${limp.length > 1 ? "go" : "goes"} limp.` : "");
  const parts = [ddTitle("Shut down lab-os?")];
  if (r.warning) { // first, before the rest (quick job 44: it was missed under the paragraph)
    const w = document.createElement("p");
    w.className = "warn";
    w.innerHTML = `<svg class="ico"><use href="#i-warn"/></svg><span></span>`;
    w.querySelector("span").textContent = r.warning;
    parts.push(w);
  }
  parts.push(say);
  const msg = Object.assign(document.createElement("p"), { className: "oo-msg" });
  msg.setAttribute("aria-live", "polite");
  // "Shut down" a red filled button, "Cancel" beside it; Cancel has the focus (quick job 154)
  const button = (label, cls, run) => {
    const b = Object.assign(document.createElement("button"), { type: "button", className: `btn small ${cls}`, textContent: label });
    b.addEventListener("click", (e) => { e.stopPropagation(); run(); });
    return b;
  };
  const go = button("Shut down", "danger", async () => {
    PM.querySelectorAll("button").forEach((b) => (b.disabled = true));
    msg.textContent = "Shutting down…";
    try {
      const res = await fetch("/api/shutdown", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ from: D?.name || "" }) });
      if (!res.ok) throw new Error(await res.text());
      const m = await res.json();
      closePower();
      (await import("/web/off.js")).showOff({ from: D?.name || "", time_ms: Date.now() + (S.clockOffset || 0) });
      V?.off();
      console.info(`hub: ${m.message}`);
    } catch (e) {
      msg.textContent = `Not shut down: ${e.message}`;
      PM.querySelectorAll("button").forEach((b) => (b.disabled = false));
    }
  });
  const cancel = button("Cancel", "", closePower), acts = Object.assign(document.createElement("div"), { className: "acts" });
  acts.append(go, cancel);
  parts.push(acts, msg);
  PMI.replaceChildren(...parts);
  dropUnder(PM, $("#sleep-btn"));
  cancel.focus();
}
$("#sleep-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  if (!canShutDown) { SFX.close(); toStart("the power button"); return; }
  if (!PM.hidden) return closePower();
  SFX.blip(); powerMenu();
  PM.hidden = false; $("#sleep-btn").setAttribute("aria-expanded", "true");
  dropUnder(PM, $("#sleep-btn")); menuOpen();
});
addEventListener("resize", () => { if (!PM.hidden) dropUnder(PM, $("#sleep-btn")); if (!$("#open-on").hidden) dropUnder($("#open-on"), $("#mod-send")); });
PM.addEventListener("click", (e) => e.stopPropagation());
addEventListener("pointerdown", (e) => { if (!PM.hidden && !PM.contains(e.target) && e.target.closest("#sleep-btn") === null) closePower(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && !PM.hidden) { e.stopImmediatePropagation(); closePower(); } }, { capture: true });
$("#settings-btn").addEventListener("click", (e) => { e.stopPropagation(); if (!S.booted || S.moduleOpen) return; SFX.blip(); hideDevice(); openModule($("#settings-btn")); });
$("#pages-btn").addEventListener("click", async (e) => {
  e.stopPropagation();
  if (!S.booted || S.moduleOpen) return;
  if (!S.page.pages) await S.readyP;  // #skip can show the hub before its page map is ready
  if (!S.booted || S.moduleOpen || !S.page.pages) return;
  SFX.blip(); hideDevice(); openModule($("#pages-btn"));
});
// the Command Center's way in (quick job 140): a flash, then it unfolds from here and plays its opening
$("#cc-launch").addEventListener("click", (e) => {
  e.stopPropagation();
  if (!S.booted || S.moduleOpen || !S.page.command) return;
  const b = $("#cc-launch");
  b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
  SFX.relock(); hideDevice(); openModule(b);
});
// the Command Center's opening plays its sounds through the hub, which has the press that unlocks sound
const FRAME_SFX = new Set(["tick", "sweep", "lock", "shock", "decode", "title", "land"]);
addEventListener("message", (e) => {
  if (e.origin !== location.origin || e.data?.type !== "lab-os-sfx" || !FRAME_SFX.has(e.data.name)) return;
  if (!$("#mod-slot iframe") || e.source !== $("#mod-slot iframe").contentWindow) return;
  SFX[e.data.name](Number(e.data.arg) || 0);
});
// A view full screen on another monitor of this computer (HDMI/DP; device.js → openOnMonitor). The page then
// asks for one click to go full screen (browsers' rule). A view with its own page opens that page; the hub's
// own views (a details page, the system diagram, the conversation) open as a hub window that shows only that
// view (?view=, quick job 101).
function viewUrl(id) {
  if (S.page[id]) return `${S.page[id]}?screen=1`;
  const u = new URL("/", location.origin);
  u.searchParams.set("view", id);
  if (myName()) u.searchParams.set("device", myName());
  return u.pathname + u.search;
}
async function sendToScreen(id, say) {
  const { openOnMonitor } = await import("/web/device.js");
  const wasFull = !!document.fullscreenElement || matchMedia("(display-mode: fullscreen)").matches;
  const done = await openOnMonitor(viewUrl(id), `lab-os-${id}`, say);
  if (!done) return;
  const place = done === "placed";
  // the browser takes this page out of full screen when it opens a window: the brain puts it back
  // (lab-os's own window only; elsewhere the full screen button shows, quick job 74)
  if (wasFull) setTimeout(async () => {
    if (document.fullscreenElement || matchMedia("(display-mode: fullscreen)").matches) return;
    const { brainWindow } = await import("/web/fullscreen.js");
    const why = await brainWindow("fullscreen");
    if (why) console.info(`hub: not full screen again (${why})`);
  }, 700);
  if (place) setTimeout(closeModule, 900);  // it lives there now; the hub's copy would hold a second connection
}
/* ---------- devices (step 8): this one's name, "open on…", pages sent here ---------- */
function closeOpenOn() { $("#open-on").hidden = true; $("#mod-send").setAttribute("aria-expanded", "false"); menuOpen(); }
function fillMenu() {
  const id = S.showing;  // any view: a page, a details page, the conversation (2026-11-21)
  DM.fillOpenOn($("#open-on .in"), D, id, {
    title: (MODULES[id] || DETAILS[id] || (id === "chat" ? ["The Conversation"] : [id]))[0],
    onSent: () => setTimeout(() => S.showing === id && closeModule(), 900),  // it lives there now
    extra: [{ label: "Another monitor of this computer", sub: "a window of its own", run: (msg) => sendToScreen(id, (m) => (msg.textContent = m)) }],
  });
}
$("#mod-send").addEventListener("click", (e) => {
  e.stopPropagation();
  if (!S.showing) return;
  if (!$("#open-on").hidden) return closeOpenOn();
  if (!D) return sendToScreen(S.showing, (m) => console.warn(`hub: ${m}`));  // devices not loaded: the old way
  SFX.blip(); fillMenu();
  $("#open-on").hidden = false; $("#mod-send").setAttribute("aria-expanded", "true");
  dropUnder($("#open-on"), $("#mod-send")); menuOpen();
});
$("#open-on").addEventListener("click", (e) => e.stopPropagation());
// All Pages in the module asks for a page (quick job 133): it opens as a module here, in place of All Pages
// (the hub itself, "/", only goes back to the hub)
addEventListener("message", (e) => {
  if (e.origin !== location.origin || e.data?.type !== "lab-os-open-view") return;
  if (!$("#mod-slot iframe") || e.source !== $("#mod-slot iframe").contentWindow) return;
  SFX.blip();
  if (e.data.id === "hub") closeModule(); else openHere(e.data.id, null);
});
// a tap anywhere outside "Open on…" closes it (quick job 129); the page in the frame has its own listener
addEventListener("pointerdown", (e) => { if (!$("#open-on").hidden && !e.target.closest("#open-on, #mod-send")) closeOpenOn(); });
// a module sent from another device: shown at once, even from the start screen (that device has the hub open,
// so it's there for this; no startup, no new conversation); a module already open here gives way
function openHere(id, sentFrom) {
  if (id === "xr") {  // only a headset's browser shows the VR hub
    if (!$("#xr-btn").hidden) location.href = "/xr";
    else voiceNote("This screen can't show the VR hub: it needs a VR headset's browser.");
    return D?.update();
  }
  if (!(S.page[id] && MODULES[id]) && !DETAILS[id] && id !== "chat") return D?.update();
  if (!S.booted) {
    $("#ignite")?.remove(); body.classList.remove("waiting"); S.igniteAt = S.igniteAt || 1; S.reveal = 1e9;
    document.querySelectorAll(".panel").forEach((p) => p.classList.add("hold"));
    S.greetP = Promise.resolve(null); S.greet = null;
    finishBoot();
  }
  if (S.sleeping) wake();
  const go = () => {
    if (S.moduleOpen) return setTimeout(go, 120);
    S.sentFrom = sentFrom; hideDevice();
    if (id === "chat") openChat(); else openModule(viewEl(id));
    S.lastInput = performance.now();  // someone wants this on screen: no reset right away
  };
  if (S.moduleOpen) closeModule();
  setTimeout(go, Math.max(0, (S.closingUntil || 0) - performance.now()));
}
import("/web/device.js").then((m) => {
  DM = m;
  D = m.connectDevice({
    state: () => ({
      stage: S.booted ? "hub" : "start",
      showing: S.moduleOpen && !S.closing ? S.showing : null,  // a page, a details page or the conversation
      from: S.sentFrom?.from || "", from_window: S.sentFrom?.from_window || "",
    }),
    onOpen: (id, from, fromWindow) => openHere(id, { from, from_window: fromWindow }),
    onClose: () => { if (S.moduleOpen) closeModule(); },
    onLive: (list) => setLive(list),
    onCard: () => { if ($("#ignite")) ignite("card", null, false); },  // the brain read the swipe (quick job 113)
    onStart: (how, from) => { if ($("#ignite")) ignite(how, from); },  // started on another device (quick job 139)
    onDevices: () => { if (DM.shouldRefill($("#open-on .in")) && S.moduleId) fillMenu(); if (S.showing === "system") drawSystem(); },
    onSettings: () => reapply(),
    onOff: () => V?.off(),
  });
}).catch((e) => console.warn(`hub: no devices (${e.message})`));
// nobody there for hub.reset_after_s (never while something is in use): back to the start screen, with a
// fresh conversation for the next visitor (the last one is kept for a while: "Bring back")
const IGNITE_HTML = $("#ignite").outerHTML;
async function checkReset() {
  if (!S.booted || S.resetting || performance.now() - S.lastInput < S.resetAfterMs) return;
  S.resetting = true;
  const st = await pollStatus();
  S.resetting = false;
  if (st && st.in_use.length) return;
  if (performance.now() - S.lastInput >= S.resetAfterMs) toStart("nobody there");
}
function toStart(why) {
  console.info(`hub: back to the start screen (${why})`);
  if (S.moduleOpen) closeModule();
  hideDevice();
  if (V) { dictateCancel(); VW?.cancel(); VW = null; V.cancel(); V.stopSpeaking(); endVoice(); VS.greeting = false; V.wake(false); renderWakeDot(); }
  fetch("/api/chat/clear", { method: "POST" }).catch(() => {});
  S.chat = []; renderChat();
  $("#reply").classList.remove("on");
  S.booted = false; S.booting = false; S.sleeping = false; body.classList.remove("sleep");
  S.errorUntil = 0;
  setState("idle");
  body.insertAdjacentHTML("beforeend", IGNITE_HTML);
  body.classList.add("waiting");
  $("#ignite").addEventListener("click", () => ignite());
  ignitionText();
  if (S.status) $("#ign-venue").textContent = S.status.venue;
  S.startGuardUntil = performance.now() + 600;
  D?.update();
}

/* ---------- main loop ---------- */
let last = performance.now(), lastClock = 0, lastLog = 0, lastVerse = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (now - lastClock > 250) {
    const [t, ap] = clockText();
    for (const [c, a] of [["#clock", "#ampm"], ["#ign-clock", "#ign-ampm"]]) { const n = $(c); if (n) { n.textContent = t; $(a).textContent = ap; } }
    lastClock = now;
  }
  pollPads();
  stepArm(now, dt);
  if (!S.vid) {  // the startup video covers these (nothing drawn under it)
    drawFx(now);
    if (S.quality !== "minimal") { stepNetwork(dt, now); stepOrb(dt, now); stepTraces(dt); if (S.quality === "maximal") stepFrame(now); }
    else stepOrbStill();
  }
  if (S.booted) {
    if (now - lastLog > 4200) { lastLog = now; typeLogLine(); }
    if (now - lastVerse > 11000) { lastVerse = now; typeVerse(); }
    if (S.quality !== "minimal" && now > nextEvent) { if (nextEvent) idleEvent(); nextEvent = now + rand(8000, 20000); }
    if (!S.sleeping && !S.moduleOpen && now - S.lastInput > S.sleepAfterMs) sleep();
  }
  if (S.moduleOpen) drawModule(now);
  requestAnimationFrame(frame);
}
addEventListener("resize", () => { resize(); if (S.booted) { drawFrame(); showTraces(); } if (S.moduleOpen) { const o = $("#orb").getBoundingClientRect(); S.orbC = { x: o.left + o.width / 2, y: o.top + o.height / 2 }; } });
resize();
readColors();
setMoney();
document.fonts && document.fonts.ready.then(() => { PAD = padChar(); setMoney(); if (S.booted) { layoutTraces(); showTraces(); } });
// the commits and the device names are drawn at the screen's real size (quick job 154)
addEventListener("resize", () => { if (COMMITS.length) drawSpark(commitDays); renderDevices(); });
// start: the theme and the brain's facts load while the start screen waits
if ($("#ignite")) body.classList.add("waiting");
S.readyP = init().then(() => {
  S.ready = true; prepareVideo();
  // ?view=<id>: a window that shows one view (Open on… → "Another monitor of this computer", quick job 101)
  const view = params.get("view");
  if (view) openHere(view, null);
});
setInterval(pollStatus, 3000);
setInterval(() => { if (S.booted && !S.sleeping) pollArm(); }, 250);
setInterval(() => { if (S.booted) refreshFacts(); }, 60_000);
setInterval(checkReset, 1000);
// #skip: jump straight to the finished hub (for screenshots and quick looks)
if (location.hash === "#skip") {
  $("#ignite").remove(); body.classList.remove("waiting"); S.igniteAt = 1; S.reveal = 1e9;
  document.querySelectorAll(".panel").forEach((p) => p.classList.add("hold"));
  S.greetP = startChat();
  finishBoot();
}
requestAnimationFrame(frame);
</script>
