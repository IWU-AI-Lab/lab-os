<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cameras</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/design/kit.css">
  <style>
    main.cams { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 0.9rem; min-height: 0; }
    /* the switches: one for each camera, lit while its picture shows */
    .switches { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .switch[aria-pressed="false"] { color: var(--text-dim); background: none; box-shadow: inset 0 0 0 1px var(--line); }
    .switch .pill { pointer-events: none; }
    /* the pictures: as big as the screen allows, side by side */
    #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; min-height: 0; overflow: auto; align-content: start; scrollbar-width: thin; }
    #grid.one { grid-template-columns: minmax(0, 1fr); }
    .cam h2 { justify-content: space-between; }
    .cam h2 .right { display: flex; align-items: center; gap: 0.6rem; flex: none; }
    .cam h2 .names { display: flex; align-items: center; gap: 0.5rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cam .also { font: var(--w-lines) 0.75rem/1.3 var(--f-lines); color: var(--text-dim); }
    .view { position: relative; aspect-ratio: 4 / 3; background: color-mix(in srgb, var(--bg) 85%, transparent); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
    #grid.one .view { max-height: calc(100vh - 13rem); margin: 0 auto; width: 100%; }
    .view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .view .why { position: relative; margin: 0; padding: 1rem 1.4rem; max-width: 30rem; text-align: center; font: var(--w-lines) 0.92rem/1.5 var(--f-lines); color: var(--text-dim); }
    .view .why.busy { color: var(--accent); }
    /* the creative touch: a tally light, as on a studio monitor. It blinks at each new picture, and
       the digits give the picture's age; both turn amber when the picture stops coming */
    .tally { display: inline-flex; align-items: center; gap: 0.45rem; font: 0.8rem/1 var(--f-digits); color: var(--c); flex: none; }
    .tally::before { content: ""; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--offline); transition: background 0.4s, box-shadow 0.4s; }
    .tally.live::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .tally.blink::before { background: var(--hot); box-shadow: 0 0 12px var(--ok); transition: none; }
    .tally.late { color: var(--accent); }
    .tally.late::before { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .tally.off { color: var(--offline); }
    .empty { margin: 0; font: var(--w-lines) 0.95rem/1.5 var(--f-lines); color: var(--text-dim); }
    /* no camera (quick job 155): a card in the middle with the camera icon and Check Again */
    #grid.none { align-content: center; justify-content: center; grid-template-columns: minmax(0, 32rem); height: 100%; }
    .none-card .in { display: grid; justify-items: center; gap: 0.9rem; padding: 2rem 2rem 1.6rem; text-align: center; }
    .none-card .big { font-size: 3.2rem; color: var(--c); }
  </style>
</head>
<!--
  Cameras (quick job 93): the picture of every camera plugged in now, live (/api/cameras: the brain's live
  device list, quick job 109; one entry for each USB socket, so two names for one socket give one picture).
  The page asks for the list every few seconds, so a camera plugged in later shows by itself. A camera that
  devices.yaml doesn't list (the webcam) shows under its socket's name, with what the system calls it.
  raspbot1's camera shows while raspbot1 is connected (its picture comes through the brain's relay). A switch for each camera hides or shows
  its picture; the choice is kept for each device ("cameras_hidden", like the other "This device"
  settings), so two screens can show different cameras. The page asks for a camera's pictures only while
  it shows them: the brain opens a camera on the first picture and closes it 5 s after the last
  (lab_os/camera_feed.py), so a hidden camera is not opened. A camera another program has open (LeLab, a
  recording) gives the brain's sentence instead of its picture (one program per port). The camera that sees
  the tic-tac-toe board has a Board button: on, the brain draws the board's cells and the numbered start
  spots on each picture (?board=1), so a person can put the pieces in place while watching.
-->
<body class="cameras">
<div class="page">
  <header class="bar">
    <div class="title"><svg class="ico"><use href="/web/design/icons.svg#i-cam"/></svg><span>Cameras</span></div>
    <span class="place"></span>
    <div class="chips"><span class="chip"><b>Shown</b><span id="count" class="pill off">—</span></span></div>
    <span class="grow"></span>
    <span class="clock"></span>
  </header>
  <main class="cams">
    <div>
      <div id="switches" class="switches" role="group" aria-label="Show or hide each camera"></div>
      <p id="msg" class="msg" aria-live="polite"></p>
    </div>
    <div id="grid"><p class="empty wait">Looking for cameras…</p></div>
  </main>
</div>
<script type="module" src="/web/design/kit.js"></script>
<script type="module">
import { deviceName, prefs, prefsKey, setPref } from "/web/device.js";

const EVERY_MS = 250, AFTER_ERROR_MS = 3000, LATE_MS = 2000, LIST_MS = 3000;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let cams = [], hidden = new Set(prefs().cameras_hidden || []), running = 0;
const boardOn = new Set();  // the cameras with the board drawn on, on this page only

// this device's choice: the brain's copy wins over the one kept in this browser
const name = deviceName();
if (name) {
  const r = await fetch(`/api/hub-devices/${name}/settings`, { cache: "no-store" }).catch(() => null);
  if (r?.ok) hidden = new Set((await r.json()).settings?.cameras_hidden || []);
}
// another window of this device changed it (the hub keeps the settings in this browser too)
addEventListener("storage", (e) => {
  if (e.key !== prefsKey()) return;
  const now = new Set(prefs().cameras_hidden || []);
  if ([...now].sort().join() !== [...hidden].sort().join()) { hidden = now; render(); }
});

async function load() {
  const r = await fetch("/api/cameras", { cache: "no-store" }).catch(() => null);
  if (!r?.ok) { $("#grid").innerHTML = `<p class="empty">The brain didn't answer. Its terminal has the details.</p>`; return; }
  const now = (await r.json()).cameras, key = (l) => l.map((c) => `${c.id}|${c.names.join()}|${c.board}`).join(";");
  if (key(now) === key(cams) && $("#grid .cam, #grid .empty:not(.wait)")) return;  // the same cameras: keep the pictures going
  cams = now;
  render();
}
setInterval(() => { if (!document.hidden) load(); }, LIST_MS);

function render() {
  const shown = cams.filter((c) => !hidden.has(c.id));
  $("#count").textContent = cams.length ? `${shown.length} of ${cams.length}` : "None";
  $("#count").className = `pill ${shown.length ? "on" : "off"}`;
  $("#switches").innerHTML = cams.map((c) => {
    const on = !hidden.has(c.id);
    return `<button type="button" class="btn small switch" data-id="${esc(c.id)}" aria-pressed="${on}" title="${on ? "Hide" : "Show"} this camera">`
      + `<span class="pill ${on ? "on" : "off"}"></span>${esc(c.id)}</button>`;
  }).join("");
  const grid = $("#grid");
  grid.classList.toggle("one", shown.length === 1);
  grid.classList.toggle("none", !cams.length);
  if (!cams.length) {
    grid.innerHTML = `<section class="card none-card"><div class="in"><svg class="ico big"><use href="/web/design/icons.svg#i-cam"/></svg>
      <p class="empty">There is no camera plugged in now. A camera shows here a few seconds after you plug it in.</p>
      <button type="button" class="btn" id="check-again">Check Again</button></div></section>`;
    $("#check-again").onclick = load;
  }
  else if (!shown.length) grid.innerHTML = `<p class="empty">Every camera is hidden on this device. Press a camera's name above to show it.</p>`;
  else {
    grid.innerHTML = shown.map((c) => `<section class="card cam" data-id="${esc(c.id)}"><div class="in">
      <h2><span class="names"><svg class="ico"><use href="/web/design/icons.svg#i-cam"/></svg>${esc(c.id)}</span><span class="right">${c.board ? `<button type="button" class="btn small switch board" aria-pressed="${boardOn.has(c.id)}" title="Draw the tic-tac-toe board's cells and the numbered start spots on the picture"><span class="pill ${boardOn.has(c.id) ? "on" : "off"}"></span>Board</button>` : ""}<span class="tally off" title="The age of the picture">--.-</span></span></h2>
      <div class="view"><img alt="${esc(c.id)}" hidden><p class="why">Opening the camera…</p></div>
      ${c.names.length > 1 ? `<p class="also">Also listed as ${c.names.slice(1).map(esc).join(", ")} (the same USB socket).</p>` : ""}
      ${c.known === false ? `<p class="also">${esc(c.title)}. It is not in devices.yaml.</p>` : ""}
    </div></section>`).join("");
  }
  start();
}

$("#grid").addEventListener("click", (e) => {
  const b = e.target.closest(".board");
  if (!b) return;
  const id = b.closest(".cam").dataset.id, on = !boardOn.has(id);
  if (on) boardOn.add(id); else boardOn.delete(id);
  b.setAttribute("aria-pressed", on);
  b.querySelector(".pill").className = `pill ${on ? "on" : "off"}`;  // the next picture has it
});

$("#switches").addEventListener("click", async (e) => {
  const b = e.target.closest(".switch");
  if (!b) return;
  const id = b.dataset.id;
  if (hidden.has(id)) hidden.delete(id); else hidden.add(id);
  render();
  const r = await setPref("cameras_hidden", [...hidden].sort());
  $("#msg").textContent = r.ok ? "" : r.message;
});

// one loop for each picture shown: ask, show, wait; a new render stops the old loops (`running` counts them)
function start() {
  const run = ++running;
  for (const card of document.querySelectorAll(".cam")) loop(card, run);
}
async function loop(card, run) {
  const img = card.querySelector("img"), why = card.querySelector(".why"), tally = card.querySelector(".tally");
  const stream = cams.find((c) => c.id === card.dataset.id)?.stream;
  if (stream) {  // the Raspbot's camera: one MJPEG stream through the brain, not picture by picture
    img.onload = () => { img.hidden = false; why.hidden = true; tally.className = "tally live"; tally.textContent = "Live"; };
    img.onerror = () => { img.hidden = true; why.hidden = false; why.textContent = "The Raspbot's camera does not answer."; };
    img.src = `${stream}?t=${Date.now()}`;
    const stop = setInterval(() => { if (run !== running) { clearInterval(stop); img.removeAttribute("src"); } }, 500);
    return;
  }
  let got = 0;
  const age = setInterval(() => {
    if (run !== running) return clearInterval(age);
    if (!got) return;
    const ms = Date.now() - got;
    tally.textContent = ms < 100000 ? (ms / 1000).toFixed(1).padStart(4, "0") : "99.9";
    tally.classList.toggle("late", ms > LATE_MS);
  }, 100);
  while (run === running && !document.hidden) {
    let wait = EVERY_MS;
    try {
      const r = await fetch(`/api/camera-feed/${encodeURIComponent(card.dataset.id)}${boardOn.has(card.dataset.id) ? "?board=1" : ""}`, { cache: "no-store" });
      if (run !== running) break;
      if (r.ok) {
        const url = URL.createObjectURL(await r.blob()), old = img.src;
        img.src = url;
        if (old.startsWith("blob:")) URL.revokeObjectURL(old);
        img.hidden = false;
        why.hidden = true;
        got = Date.now();
        tally.className = "tally live blink";
        setTimeout(() => tally.classList.remove("blink"), 90);
      } else {
        const text = await r.text();
        why.textContent = text;  // e.g. "… is in use by lelab: one program per port. …"
        why.classList.toggle("busy", /in use by/.test(text));
        why.hidden = false;
        img.hidden = true;  // the sentence instead of an old picture
        got = 0;
        tally.className = "tally off";
        tally.textContent = "--.-";
        wait = AFTER_ERROR_MS;
      }
    } catch {
      wait = AFTER_ERROR_MS;  // the brain is away
    }
    await new Promise((ok) => setTimeout(ok, wait));
  }
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); else running++; });
load();
</script>
</body>
</html>
