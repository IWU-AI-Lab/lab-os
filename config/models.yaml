# AI setups: which AI service answers, through the OpenAI-style chat interface (docs/dev/chat.md).
# Setups differ only by address, model name and key name, so switching is a config edit + restart.
# No keys here: `key_env` names the variable in .env that holds the key (none = no key needed).
# A persona picks a setup by name (`model: main`); a place can have its own models.yaml.
#
# Prices: US dollars per 1 million tokens (input / cached input / output), checked 2026-11-09.
# They only feed the spend log and the monthly budget (place.yaml → ai_budget_usd_month), so
# keep them current: https://developers.openai.com/api/docs/pricing, https://ai.google.dev/pricing
version: 1

setups:
  main:
    where: OpenAI
    base_url: https://api.openai.com/v1
    model: gpt-6-luna          # OpenAI's small, fast model (Chat Completions, streaming, tools)
    key_env: OPENAI_API_KEY
    price_per_mtok: {input: 0.10, cached_input: 0.01, output: 0.50}
    options:                   # added to every request as is
      reasoning_effort: none   # quick answers; also needed for tools on Chat Completions (step 6)
      max_completion_tokens: 800
    fallback: backup           # no OPENAI_API_KEY in .env → use this setup instead

  strong:
    # Harder questions (quick job 69): maths, a plan, something not about the lab. The quick
    # model calls its think_hard tool and says "Let me think about that." first; the answer is
    # in the AI spend under "strong". The same model, made to think first (slower, more output
    # tokens). A bigger model works too: change `model` (and its prices).
    where: OpenAI, thinking
    base_url: https://api.openai.com/v1
    model: gpt-6-luna
    key_env: OPENAI_API_KEY
    price_per_mtok: {input: 0.10, cached_input: 0.01, output: 0.50}
    options:
      reasoning_effort: high
      max_completion_tokens: 4000
    fallback: backup           # no OpenAI key: the quick setup answers, and there's no tool

  backup:
    where: Gemini, free key
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.5-flash-lite  # answers quickly on the free key; gemini-3.8-flash was
    # overloaded there on 2026-11-09 (HTTP 503 "high demand", then no answer in 30 s)
    key_env: GEMINI_API_KEY
    # Free tier: $0 (Google may use free-tier chats to improve its products). A paid key costs
    # 0.30 / 2.50 per 1M tokens: put those here if the key is ever paid.
    price_per_mtok: {input: 0, cached_input: 0, output: 0}
    options:
      max_tokens: 800

  local:
    where: On this computer, no internet
    # Ollama (`ollama serve`, then `ollama pull qwen3:4b`). llama.cpp's server works too, but its
    # default port 8080 is the hub's: start it with --port 8082 and use http://127.0.0.1:8082/v1.
    # Careful on the lab desktop: its GPU is shared with the training project.
    base_url: http://127.0.0.1:11434/v1
    model: qwen3:4b
    key_env: none
    price_per_mtok: {input: 0, cached_input: 0, output: 0}
    options:
      max_tokens: 800

# Voice setups (focus step 7, docs/archive/guides-2026-11-25/voice.md): who hears (speech-to-text) and who speaks
# (text-to-speech). A persona picks one by name (`voice: main`; `voice: none` = no voice).
# `fallback` works like the chat's: no key in .env → the next setup.
# `hear`: Gemini's is a Live API transcription model (the words arrive while you talk);
# OpenAI's hears the recording after the release. `speaker`: the service's voice name.
# Prices: US dollars per minute of audio, checked 2026-11-10 (docs/archive/focus-2026-11-13-hub-voice-ai.md, step 7).
voices:
  main:
    where: OpenAI
    service: openai
    base_url: https://api.openai.com/v1
    hear: gpt-4o-mini-transcribe
    # tts-1-hd since quick job 83: gpt-4o-mini-tts renders the style text again for each sentence,
    # and the voice drifted between answers (GOTCHAS 2026-11-20, case 2). tts-1-hd takes no style.
    speak: tts-1-hd
    speaker: fable                     # OpenAI's voices: fable, alloy, echo, onyx, nova, shimmer, …
    # a persona's `speakers:` wins (quick job 100: J.A.R.V.I.S. fable, the British voice; the Lab Assistant nova)
    # `style:` (accent, mood, manner) works only with gpt-4o-mini-tts and newer, e.g.:
    # style: A lively, warm British accent (Received Pronunciation). Upbeat and engaged.
    # speed: 1                          # 1 = normal (OpenAI: 0.25–4). 1.15 until quick job 111:
    # tts-1-hd then spoke about 1.2 times faster and cut the end of the last word.
    key_env: OPENAI_API_KEY
    price_per_min: {heard: 0.003, spoken: 0.015}
    fallback: backup           # no OPENAI_API_KEY in .env → Gemini's free key

  backup:
    where: Gemini, free key
    service: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    hear: gemini-3.5-transcribe-live   # streamed: ~0.4 s after you let go (checked 2026-11-12);
    # plain gemini-3.5-flash-lite took ~10 s to transcribe the same 4 s of speech
    # The free key allows only 3 speech requests a minute per model (checked 2026-11-12), so the
    # next model takes over while one is over its limit (~12 a minute in all; an answer uses 2).
    speak: [gemini-3.8-flash-lite-tts, gemini-3.8-flash-tts, gemini-3.1-flash-tts-preview,
            gemini-2.5-flash-preview-tts]   # ~2–4 s for a sentence; they answer with a WAV
    speaker: Charon                    # Gemini's voices: Charon, Kore, Puck, Fenrir, Aoede, …
    key_env: GEMINI_API_KEY
    # Free tier: $0, but Google may use the audio to improve its products; limits per minute/day.
    price_per_min: {heard: 0, spoken: 0}
