# Robot registry. Names follow docs/plan/lab-jarvis-log.md.
#
# Serial devices are listed ONLY by /dev/serial/by-id/ path (ttyACM numbers swap; see docs/dev/GOTCHAS.md).
# Cameras are listed ONLY by USB socket (/dev/v4l/by-path/): identical cameras share a serial.
# off_limits: true -> lab_os.devices refuses to hand out the port.
# table_z_cm       -> arms: where the table is in the arm's own heights (cm; its z 0 is the bottom of
#                     its base). 0 (the default) when it stands on the table; negative when it stands
#                     on a plate. Every height the AI tools, pick_at, the floor and teleop use is then
#                     measured from the table (quick job 28).
# serial           -> headsets: the serial number `adb devices` lists (the Quest's view, quick job 36)
# mirror           -> headsets: extra scrcpy options for its view on the brain's computer, e.g.
#                     ["--crop=2064:2208:0:0"] for one eye, ["--fullscreen"] (docs/guides/quest-view.md)
# borrowed: true   -> another project's device (CLAUDE.md, "Hard rules"): lab-os may drive or use
#                     it, but never sets it up (no motor IDs, baud rate, firmware, calibration),
#                     drives it with a copy of its training calibration, and never opens it while
#                     another program has it open. Never remove this for the green ones.

devices:
  so101-green:
    kind: so101
    borrowed: true
    # The calibration the training used (LeRobot's command line, --robot.id=sheep): the source of
    # truth, read only. lab-os drives with its copy, calibration/so101-green/so101-green.json, and
    # refuses if the copy differs from it or the motors don't hold it (2026-11-17).
    training_calibration: robots/so_follower/sheep.json
    table_z_cm: 0  # stands on the table
    notes: >-
      Follower of the SO-101 training set (the builder's training project, LeLab). Drivable by
      lab-os since 2026-11-12 with four rules: no motor setup, calibration read only, the lerobot
      env untouched, never while LeLab or a run has its port open.
    ports:
      - /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B41533501-if00
    usb:
      - {vendor_id: 0x1a86, product_id: 0x55d3, serial: "5B41533501"}

  so101-green-leader:
    kind: so101-leader
    borrowed: true
    training_calibration: teleoperators/so_leader/shepherd.json   # as for the follower
    notes: Leader of the SO-101 training set (same rules as so101-green).
    ports:
      - /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B41531599-if00
    usb:
      - {vendor_id: 0x1a86, product_id: 0x55d3, serial: "5B41531599"}

  # The training set's two cameras (Innomaker U20CAM-1080p, 0c45:6366, both serial SN0001):
  # sockets from `ls -l /dev/v4l/by-path/` on 2026-11-11. Unplugging the wrist camera removed
  # usb-0:7 (lab check 8.15, 2026-11-16), so 7 is the wrist and 8 the stand camera (renamed from
  # -cam-a / -cam-b 2026-11-17, quick job 25).
  so101-green-cam-wrist:
    kind: camera
    borrowed: true
    socket: usb-0:7
    notes: The green follower's wrist camera, looking along the jaws (lab desktop's USB socket 7).

  so101-green-cam-stand:
    kind: camera
    borrowed: true
    socket: usb-0:8
    notes: The green set's stand camera, looking at the table from above (lab desktop's USB socket 8).

  # HACK (2026-11-12, temporary, for today's camera test with the AI): the two cameras plugged in
  # now are the WHITE arm's, but they sit in sockets 7 and 8, which are registered above as the
  # green set's. These two names point at the same sockets so the AI can use them (renamed -cam-a/-b →
  # -cam-stand/-cam-wrist 2026-11-16, quick job 15). Clean up: own sockets per setup, see docs/plan/current-focus.md -> "Hacks to clean up".
  # Socket 7 is the wrist camera and 8 the stand camera, as on the green set: unplugging the wrist
  # camera removed usb-0:7 (lab check 3.9, 2026-11-17); swapped 2026-11-18, quick job 29.
  so101-white-cam-stand:
    kind: camera
    socket: usb-0:8
    notes: White arm's camera, in the lab desktop's USB socket 8. The stand camera, on the 3D-printed stand about 2 ft up, behind the arm, looking forward and down over it.

  so101-white-cam-wrist:
    kind: camera
    socket: usb-0:7
    notes: White arm's camera, in the lab desktop's USB socket 7. On the wrist, looking along the jaws.

  so101-white:
    kind: so101
    notes: >-
      Follower. Polished teleop demo + second act. Controller board 1a86:55d3, same chip as
      green's: compare the LAST digits of the serial. Board swapped 2026-10-30 (was …2183).
    # It stands on the stand camera's base plate: the table is ~1.6 cm below its z 0 (measured
    # 2026-11-17, GOTCHAS; lab check 3.2 said ~1.5). Lab check F.2 measures it by touching the table.
    table_z_cm: -1.6
    ports:
      - /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B41532410-if00
    usb:
      - {vendor_id: 0x1a86, product_id: 0x55d3, serial: "5B41532410"}

  so101-white-leader:
    kind: so101-leader
    notes: >-
      Leader arm for so101-white. Fill in the port once built; the spare white board
      5B41532183 (the follower's until 2026-10-30) is probably this one's.
    ports: []

  xarm1:
    kind: xarm1s
    notes: >-
      Built, works over USB HID (not serial). Teleop prototype + JARVIS-track robot.
      lsusb calls 0483:5750 an "LED badge"; match the product and serial too.
    ports: []
    usb:
      - {vendor_id: 0x0483, product_id: 0x5750, product: xArm, serial: "720710C0D60063300023D4D4"}

  xarm2:
    kind: xarm1s
    notes: Unbuilt spare.
    ports: []

  fake-arm:
    kind: fake
    notes: Software-only arm for tests and home development.
    ports: []

  # The lab's three Meta Quest 3 headsets (quick job 8, 2026-11-16). No labels on them: tell them
  # apart by serial number (Quest's Settings → About, or `adb devices`). The name is also what the
  # Quest's browser uses for the hub (`/design?device=quest-a`).
  quest-a:
    kind: quest
    serial: 2G97C5ZHB300FG
    notes: Quest A. The builder's (probably). Teleop, the hub in VR.

  quest-b:
    kind: quest
    serial: 2G97C5ZHB3053L
    notes: Quest B. B or C is on loan to an AI club member (which one isn't known yet).

  quest-c:
    kind: quest
    serial: 2G97C5ZHB3034N
    notes: Quest C. B or C is on loan to an AI club member (which one isn't known yet).
