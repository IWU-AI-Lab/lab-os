# Robot registry. Names follow docs/lab-jarvis-log.md.
#
# Serial devices are listed ONLY by /dev/serial/by-id/ path (ttyACM numbers swap; see docs/GOTCHAS.md).
# off_limits: true  -> lab_os.devices refuses to hand out the port. Never remove this for so101-green.

devices:
  so101-green:
    kind: so101
    off_limits: true
    notes: >-
      Another project's training arm (leader + follower). Never open, never recalibrate.
      Ports confirmed as so101-green by the owner on 2026-10-24.
    ports:
      - /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B41531599-if00
      - /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B41533501-if00
    # USB serial numbers: blocks the arm on every OS (COM ports / macOS paths differ, serials don't).
    usb:
      - {vendor_id: 0x1a86, serial: "5B41531599"}
      - {vendor_id: 0x1a86, serial: "5B41533501"}

  so101-white:
    kind: so101
    notes: Follower. Polished teleop demo + second act. Fill in the port once built.
    ports: []

  so101-white-leader:
    kind: so101-leader
    notes: Leader arm for so101-white. Fill in the port once built.
    ports: []

  xarm1:
    kind: xarm1s
    notes: >-
      Built, works over USB HID (not serial). Teleop prototype + JARVIS-track robot.
      lsusb calls 0483:5750 an "LED badge"; match the product and serial too.
    ports: []
    usb:
      - {vendor_id: 0x0483, product_id: 0x5750, product: xArm, serial: "720710C0D60063300023D4D4"}

  xarm2:
    kind: xarm1s
    notes: Unbuilt spare.
    ports: []

  fake-arm:
    kind: fake
    notes: Software-only arm for tests and home development.
    ports: []
