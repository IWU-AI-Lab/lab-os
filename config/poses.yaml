# Named poses for the AI tools' go_to_pose (docs/guides/ai-control.md), per arm model (an Arm's `model`).
# Shared joint names, degrees. A pose may list only some joints; the others stay where they are.
# Every pose must sit inside the arm's soft limits (3° inside its limits) with the gripper above the
# venue's floor (tests/test_robot_tools.py). A joint past a soft limit is clipped to it when the arm
# goes there (the move says so); the test lists the ones that are, so nothing new slips past.

so101:
  ready:  # the working pose, teleop's and the fake arm's start: gripper ~26 cm out, ~5 cm up, tilted down
          # (called `home` until 2026-11-17, quick job 20)
    shoulder_pan: 0
    shoulder_lift: -20
    elbow_flex: 40
    wrist_flex: 40
    wrist_roll: 0
    gripper: 30
  home:   # folded, where the arm is left (quick job 30, 2026-11-18): the green follower as the builder
          # leaves it (lab check 8.16), hovering just above where it rests: gripper ~14 cm out, its
          # lowest point ~1.8 cm above the table (on so101-white's plate ~3.4 cm).
          # - shoulder_lift and elbow_flex are the real numbers, past the soft limits (-97.0 / 93.8)
          #   by 6.3° and 3.6° (and the URDF's -100 / 96.8 by 3.3° and 0.6°): the move clips them and
          #   says so; the limits aren't widened.
          # - wrist_flex 55, not the real 75.9: with 75.9 the model puts the gripper point ~1 cm
          #   below the table (the height reads 1-2 cm low there), so the floor refused the move
          #   (the builder's choice, 2026-11-18). Let go of the arm and it settles into the real rest.
    shoulder_pan: -2.2
    shoulder_lift: -103.3
    elbow_flex: 97.4
    wrist_flex: 55
    wrist_roll: 87.4
    gripper: 16.5

xarm1s:
  home:   # the software xArm's start pose (lab-os-teleop --arm fake-xarm1)
    shoulder_pan: 0
    shoulder_lift: 0
    elbow_flex: 70
    wrist_flex: 30
    wrist_roll: 0
    gripper: 30
  upright:  # all zero: the pose the board's "Run" button puts it in
    shoulder_pan: 0
    shoulder_lift: 0
    elbow_flex: 0
    wrist_flex: 0
    wrist_roll: 0
