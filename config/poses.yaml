# Named poses for the AI tools' go_to_pose (docs/guides/ai-control.md), per arm model (an Arm's `model`).
# Shared joint names, degrees. A pose may list only some joints; the others stay where they are.
# Every pose must sit inside the arm's limits with the gripper above the table (tests/test_robot_tools.py).

so101:
  home:   # the teleop working pose (same as the fake arm's start): gripper ~26 cm out, ~5 cm up, tilted down
    shoulder_pan: 0
    shoulder_lift: -20
    elbow_flex: 40
    wrist_flex: 40
    wrist_roll: 0
    gripper: 30
  rest:   # folded: upper arm back, forearm down, gripper ~21 cm out and ~6 cm up, closed.
          # HACK: from forward kinematics only, not yet checked on the real so101-white (docs/plan/current-focus.md → Hacks)
    shoulder_pan: 0
    shoulder_lift: -95
    elbow_flex: 92
    wrist_flex: 35
    wrist_roll: 0
    gripper: 0

xarm1s:
  home:   # the software xArm's start pose (lab-os-teleop --arm fake-xarm1)
    shoulder_pan: 0
    shoulder_lift: 0
    elbow_flex: 70
    wrist_flex: 30
    wrist_roll: 0
    gripper: 30
  upright:  # all zero: the pose the board's "Run" button puts it in
    shoulder_pan: 0
    shoulder_lift: 0
    elbow_flex: 0
    wrist_flex: 0
    wrist_roll: 0
