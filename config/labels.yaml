# The words the Raspbot's labels look for (the LABELS button in the VR and AR Raspbot window).
# The detector (YOLOE, src/lab_os/object_labels.py) finds any object that a word names, also
# words outside the usual kinds: "blue cube", "LEGO brick". A short, plain name works best.
# After a change, run `uv run lab-os labels build` on the brain's computer (it needs the internet
# once), then start the brain again. Fewer words: fewer wrong labels.
version: 1

words:
  # the lab's own things
  - blue cube
  - red cube
  - green cube
  - yellow cube
  - LEGO brick
  - robot arm
  - robot car
  - cardboard box
  - cable
  - screwdriver
  - pliers
  - roll of tape
  - marker
  - pen
  - whiteboard
  - computer monitor
  - VR headset
  - game controller
  - trash can
  - door
  - shoe
  # the 80 common kinds (COCO)
