# Venue profile: the AI lab. Decides which plug-ins are active and how cautious to be.
name: lab
active_devices: [fake-arm, xarm1, so101-white, so101-green]
motion_allowed: true
persona: default   # who the assistant is here: a persona's id (config/personas/), or `default` = the place's (place.yaml)
wake_word: default   # the persona's wake word on screens that chose it (docs/guides/voice.md): on, off, or default = off on a public venue
max_speed_scale: 0.5   # fraction of each arm's max speed
one_to_one_max_deg_per_s: 180   # teleop 1:1: fastest joint turn (°/s), not scaled by the speed above; none = the servos' own top speed (~270-310), off = relative only
ai_tools:              # what an AI tool may do per call (docs/guides/ai-control.md); left out = these defaults
  max_joint_change_deg: 30   # move_joints / go_to_pose: no joint moves further in one call (the gripper may)
  max_move_cm: 10            # move_to: the gripper moves at most this far in one call
  min_z_cm: 0.2              # nothing goes lower than this (cm) above the table; also teleop's floor. From the table since quick job 28 (2026-11-18). 0.2 since 2026-11-24 (the builder: 0.9 cm lower than 1.1, because the jaws closed above a 3 cm piece; docs/plan/log.md)
limits:                # safety limits that can be switched off (here or Settings → Safety limits); on by default.
  per_move: on               # the AI tools' per-call limit (max_joint_change_deg, max_move_cm)
  speed_cap: on              # max_speed_scale and one_to_one_max_deg_per_s (off: up to full speed)
  floor: on                  # min_z_cm, for the AI tools and teleop alike
