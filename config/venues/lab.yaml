# Venue profile: the AI lab. Decides which plug-ins are active and how cautious to be.
name: lab
active_devices: [fake-arm, xarm1, so101-white]
motion_allowed: true
max_speed_scale: 0.5   # fraction of each arm's max speed
persona: lab-assistant # who the assistant is (config/personas/): lab-assistant (plain) | jarvis (show)
ai_tools:              # what an AI tool may do per call (docs/ai-control.md); left out = these defaults
  max_joint_change_deg: 30   # move_joints / go_to_pose: no joint moves further in one call (the gripper may)
  max_move_cm: 10            # move_to: the gripper moves at most this far in one call
  min_z_cm: 1                # nothing goes lower than this above the arm's base plane (the table)
