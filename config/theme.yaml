# Design tokens: the one place for visual style. What they mean and how to use them:
# docs/design/DESIGN.md (change both together). Same theme for every persona.
#
# Served to the pages as /theme.json, re-read on every request: edit, then reload the page.
# Colors are "#rrggbb" (see-through amounts are separate 0–1 numbers). Times: _ms milliseconds,
# _s seconds. "Used by" notes say where a token is read today; "(planned)" = for the hub, not read yet.

colors:
  background: "#05080b"  # near-black behind everything. Used by: (pages still use style.css for now)
  surface: "#0b161c"     # panel fill, drawn see-through (glow.panel_fill). (planned)
  line: "#1f3d48"        # quiet structure: grids, idle frames, background circuits. (planned)
  text: "#d4eef5"        # main text. Used by: (pages still use style.css for now)
  text_dim: "#6d8c96"    # labels, secondary text. (planned)
  primary: "#29d4ff"     # cyan, the main color; change this to recolor (surface/line/hot/text are cyan-tinted). Used by: robot joints in the 3D views, controller pointer
  hot: "#eafcff"         # white-hot core of the brightest things only. (planned)
  accent: "#ff9a2e"      # amber: "look here", busy, warnings. Used by: gripper jaws in the 3D views
  danger: "#ff2436"      # aggressive red: critical, a person must act (error, stop). (planned)
  offline: "#56636a"     # gray: offline, disabled, not connected. Dim, never glows, never red. (planned)
  ok: "#3ee07f"          # "following" / clutch engaged. Used by: right controller marker, clutch line
  frozen: "#7a1d00"      # muted rust: arm held still (dead-man stop). Calm, not an alert. Used by: 3D views

font:                    # one font per role; every font in `bundled` ships with the code, so swap freely
  bundled: [Orbitron, Oxanium, Chakra Petch, Rajdhani, Inter, JetBrains Mono, DSEG7, DSEG14, Doto, Share Tech Mono]
  display: "Orbitron, 'Chakra Petch', system-ui, sans-serif"  # titles only, CAPS. (planned)
  display_weight: 700
  family: "'Chakra Petch', system-ui, sans-serif"   # interface + chat. Used by: headset status panel
  family_weight: 500
  lines: "Inter, system-ui, sans-serif"             # typed-out lines, lighter secondary text. (planned)
  lines_weight: 300      # light only; heavier looks bloated
  digits: "DSEG7, 'JetBrains Mono', ui-monospace, monospace"  # clock, joint values, timestamps; numbers only. (planned)
  mono: "'JetBrains Mono', ui-monospace, monospace"           # commands and file names in chat. (planned)
  base_size_px: 20       # body text on the 32" monitor. Used by: (pages still use style.css for now)
  scale_with_screen: true  # hub sizes follow the screen (the smaller of width/height decides), so the core keeps its share. (planned)
  label_spacing_em: 0.12 # extra letter spacing for CAPS labels and titles. (planned)

alerts:                  # (planned)
  mood: room             # local = only the affected thing changes color; room = the whole screen shifts
  warning_pulse_s: 2     # one slow amber pulse every 2 s
  critical_pulse_hz: 1.5 # red pulses per second (stay under 3: seizure safety)
  critical_edge: true    # red glow around the screen edge while critical

assistant:               # the assistant's picture per state; color names a token above. (planned)
  idle: { color: primary, brightness: 0.6, breathe_s: 5 }
  listening: { color: primary, brightness: 1.0, breathe_s: 2 }
  thinking: { color: primary, brightness: 0.8, breathe_s: 1.2 }  # rings spin faster
  speaking: { color: hot, brightness: 1.0 }                      # brightness follows loudness
  offline: { color: offline, brightness: 0.35 }
  error: { color: danger, brightness: 0.9 }

lines:                   # (planned)
  hair_px: 1             # structure
  normal_px: 2           # active things
  bold_px: 4             # the few key arcs
  corner_cut_px: 12      # 45° cut corners instead of rounded ones
  grid_dot_spacing_px: 32

glow:                    # a sharp line + two soft halos; only active things glow. (planned)
  near_px: 6
  near_strength: 0.45
  wide_px: 18
  wide_strength: 0.15
  panel_fill: 0.08       # how see-through panel fills are (0 = invisible)
  back_layer: 0.35       # brightness of the far layer (the network, faint circuits)

network:                 # the far background: drifting dots linked when close. (planned)
  dots_per_mpx: 90       # dots per million screen pixels (~190 on a 1080p screen)
  link_px: 140           # dots closer than this get a line; closer = brighter
  drift_px_s: 10         # drift speed
  push_radius_px: 170    # mouse / finger pushes dots away within this distance
  fire_every_s: [2, 6]   # random pause between pulses running along links (faster while thinking)

motion:                  # (planned)
  quick_ms: 120          # button reacts
  normal_ms: 300
  panel_ms: 600          # panel unfolds
  cinematic_ms: 1400     # big startup moments
  stagger_ms: 60         # gap between items appearing one after another
  arrive: "cubic-bezier(0.16, 1, 0.3, 1)"  # starts fast, settles slowly
  leave: "cubic-bezier(0.7, 0, 0.84, 0)"   # leaves quickly
  max_flashes_per_s: 3   # never flash faster (seizure safety)
  idle:
    ring_turn_s: [25, 40, 70]  # seconds per full turn, one per ring, alternating direction
    dot_flow_px_s: 40          # flowing dots in the back layer
    type_chars_per_s: 40       # typing text
    event_every_s: [8, 20]     # random pause between small idle events
    event_sound_chance: 0.35   # share of idle events that make a matching sound; silent otherwise
    sleep_after_s: 300         # nobody using it: dim to network + breathing assistant

hub:                     # (planned)
  layout: launcher       # launcher = buttons around the core open full-screen modules | panels
  modules: [teleop, monitor, arm]  # buttons, in order, alternating left/right of the core; [] works.
                         # Chat isn't listed: it belongs to the core (tap it or start typing) and is always there.
  devices_view: auto     # auto = graph up to devices_graph_max, hive above | graph | hive. The panel's arrow expands a named list.
  devices_graph_max: 8   # graph = a star of devices around the brain; hive = one row of small hexagons per kind
  panel_style: callouts  # callouts = label on a line, no boxes | sentences = one line with the number in it | tiles (comparison only)
  portrait: stack        # portrait screens: core on top, buttons in a row under it, facts in two columns
  density: busy-edges    # sparse | busy-edges | dense: how full the hub looks at rest
  filler: false          # true = decorative hex/code streams in the dim back layer (real data otherwise)
  background_text: verses     # far-layer typing text in maximal quality: verses | none
  verses_translation: KJV     # public domain
  type_to_chat: true     # typing anywhere opens the chat with the letters in it

clock: 24h               # 24h | 12h (AM/PM shown small in the interface font). (planned)

startup:                 # (planned)
  style: assemble        # assemble | hyperspace
  max_s: 6               # any input skips straight to the hub
  hyperspace:            # stars stretch into lines, the lines charge up, the jump, then a flash and a long brake
    stars: 1000          # how dense the star field is (lines are drawn in batches, so this stays cheap)
    stretch_s: 1.1       # stars fly toward you, leaving lines that point away from the middle
    charge_s: 0.6        # lines brighten, a glow builds in the middle
    jump_s: 0.8          # lines shoot past, new ones stream from the middle
    impact_frame: true   # ~80 ms freeze, black lines on white, right before the flash (never red)
    brake_s: 2.6         # after the flash: a long ease-out; the network starts white-hot and dims as it settles

quality:                 # what each level keeps. minimal = the lightweight mode. (planned)
  default: full
  maximal: { idle: true, glow: true, blur: true, particles: true, network: dense, extra_rings: true, frame_details: true, background_text: true }
  full: { idle: true, glow: true, blur: true, particles: true, network: interactive }
  reduced: { idle: true, glow: true, blur: false, particles: false, network: small }
  minimal: { idle: false, glow: false, blur: false, particles: false, network: still }

arm3d:                   # the 3D arm (desktop panel + headset), on a dark background
  body: "#8fa3ab"        # SO-101 meshes: light steel, so cyan joints and amber jaws stand out
  stick: "#4f7380"       # stick-figure links, base disc
  grid: "#1f3d48"        # floor grid (desktop view)
  grid_center: "#2f6070" # floor grid center lines
  idle_marker: "#6d8c96" # controller marker when not clutched
  xarm:                  # xArm 1S model parts
    metal: "#9aa8b0"
    servo: "#1a2328"
    plate: "#24323a"
    cup: "#7d8b92"
    board: "#1f5a35"
