# Fixed moves the hub plays on an arm (quick job 35): no AI chooses the motion. Per arm model
# (an Arm's `model`): a start pose from poses.yaml (`from`) and steps, each relative to it (degrees,
# shared joint names); the arm ends back at the start pose. Played at the venue's speed, through
# the robot tools' checks: the soft joint limits, the floor, STOP and one controller at a time
# (tests/test_visitors.py). The arm goes to the start pose first, wherever it is.

so101:
  wave:   # "wave" while visitors are here (quick job 52, the builder's pick, 2026-11-20): the arm
          # turns 70° so it bends across your view, raises the hand (~50 cm up, jaws a little open),
          # and the forearm and the wrist swing side to side, about 25 cm at the hand; then back to
          # `ready`. Was: the shoulder turned a little and the wrist nodded, low (F.11).
    from: ready
    steps:
      - {shoulder_pan: 70, shoulder_lift: 5, elbow_flex: -95, wrist_flex: -45, gripper: 45}
      - {shoulder_pan: 70, shoulder_lift: 5, elbow_flex: -75, wrist_flex: -15, gripper: 45}
      - {shoulder_pan: 70, shoulder_lift: 5, elbow_flex: -110, wrist_flex: -75, gripper: 45}
      - {shoulder_pan: 70, shoulder_lift: 5, elbow_flex: -75, wrist_flex: -15, gripper: 45}
      - {shoulder_pan: 70, shoulder_lift: 5, elbow_flex: -110, wrist_flex: -75, gripper: 45}
      - {shoulder_pan: 70, shoulder_lift: 5, elbow_flex: -95, wrist_flex: -45, gripper: 45}
