<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostics</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/design/kit.css">
  <style>
    /* Diagnostics (quick job 135): a card for each device, made to fit its kind; ?device= shows one */
    main.dx { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 0.9rem; min-height: 0; }
    .sum { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.4rem; }
    .sum .msg { margin: 0; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); gap: 1rem; min-height: 0; overflow: auto; align-content: start; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #grid.one { grid-template-columns: minmax(0, 1fr); }
    .dev > .in { display: grid; gap: 0.7rem; align-content: start; }
    .dev.off { opacity: 0.45; }
    .dev .head { display: flex; align-items: center; gap: 0.6rem; }
    .dev .head .ico { color: var(--c); font-size: 1.2rem; }
    .dev .head b { flex: 1; font: 500 1rem/1.2 var(--f-ui); color: var(--hot); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dev .head button { flex: none; }
    .dev .what { margin: 0; font: var(--w-lines) 0.85rem/1.4 var(--f-lines); color: var(--text-dim); }
    .dev .what.bad { color: var(--accent); }
    .tag { font: 600 0.62rem/1 var(--f-ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); border: 1px solid var(--line); padding: 0.2rem 0.4rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 0.6rem 1rem; margin: 0; }
    .stats div { display: grid; gap: 0.2rem; }
    .stats dt { font: 600 0.62rem/1 var(--f-ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
    .stats dd { margin: 0; font: 500 0.95rem/1.25 var(--f-ui); color: var(--text); }
    .stats dd .num { font-size: 1.1rem; color: var(--c); }
    .ok { color: var(--ok); } .warn { color: var(--accent); } .bad { color: var(--danger); }
    table.motors { font: 500 0.85rem/1.2 var(--f-ui); }
    table.motors th { font: 600 0.6rem/1 var(--f-ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--line); padding-bottom: 0.35rem; }
    table.motors td { border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); white-space: nowrap; }
    table.motors td.n { font-family: var(--f-mono); font-size: 0.8rem; text-align: right; padding-right: 0.9rem; }
    table.motors th.n { text-align: right; padding-right: 0.9rem; }
    table.motors tr.warn td:first-child, table.motors tr.bad td:first-child { box-shadow: inset 2px 0 0 currentColor; padding-left: 0.4rem; }
    .pic { max-width: 32rem; aspect-ratio: 4 / 3; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; overflow: hidden; }
    .pic img { width: 100%; height: 100%; object-fit: contain; }
    .wins { display: grid; gap: 0.3rem; }
    .wins div { display: grid; grid-template-columns: minmax(5rem, auto) auto minmax(0, 1fr); gap: 0.8rem; font: var(--w-lines) 0.85rem/1.3 var(--f-lines); color: var(--text); }
    .wins span:nth-child(2) { font-family: var(--f-mono); font-size: 0.78rem; color: var(--text-dim); }
    #grid.one .dev .stats { grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); }
    #grid.one table.motors { font-size: 1rem; }
  </style>
</head>
<!--
  Diagnostics (quick job 135): every device's health from GET /api/diagnostics (src/lab_os/hub/diagnostics.py),
  read every second. ?device=<name> shows one device (a name, a display name or words like "the Raspbot").
  Opens from All Pages, a device's modules in the Command Center, and by voice. Only reads. Script below.
-->
<body class="settings">
<div class="page">
  <header class="bar">
    <div class="title"><svg class="ico"><use href="/web/design/icons.svg#i-test"/></svg><span>Diagnostics</span></div>
    <span class="place"></span>
    <span class="grow"></span>
    <span class="clock"></span>
  </header>
  <main class="dx">
    <div class="sum"><span class="chips" id="sum"></span><button class="btn small" id="all" type="button" hidden>All devices</button><p class="msg" id="msg"></p></div>
    <div id="grid" aria-live="polite"></div>
  </main>
</div>
<script type="module" src="/web/design/kit.js"></script>
<script type="module" src="/hub/diagnostics.js"></script>
</body>
</html>
