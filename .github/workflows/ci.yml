# Lint + tests once for each push: a push to main, or a push to a branch with a pull request.
# (A push to a branch with no pull request runs nothing.) No hardware: tests use the fake arm only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install (exactly what uv.lock pins)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests (in parallel, one worker per CPU)
        run: uv run pytest -q -n auto
