[project]
name = "lab-os"
version = "0.1.0"
description = "lab-os: a portable brain that connects the AI lab's robots."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "colorlog>=6.12",
    "hid>=1.0.9",
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "onnxruntime>=1.20,<2",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
lab-os = "lab_os.cli:run"
lab-os-teleop = "lab_os.teleop.cli:run"

[project.optional-dependencies]
so101 = [
    "lerobot[feetech]>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_os"]

[tool.uv]
# Never pick up conda's Python (the shared lerobot env lives there).
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# with -n (pytest-xdist): an idle worker takes tests from a busy one, so a few slow tests at the
# end of the list don't keep the run waiting (9 s instead of 14 s). Without -n it does nothing.
addopts = "--dist worksteal"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
