[project]
name = "lab-os"
version = "0.1.0"
description = "Lab JARVIS: a portable brain that connects the AI lab's robots."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "hid>=1.0.9",
    "pyyaml>=6.0",
]

[project.scripts]
lab-os = "lab_os.cli:main"
lab-os-teleop = "lab_os.teleop.cli:main"

[project.optional-dependencies]
so101 = [
    "lerobot[feetech]>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_os"]

[tool.uv]
# Never pick up conda's Python (the shared lerobot env lives there).
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
